}

function App(){
  const [dark,setDark]=useState(false); // claro por defecto durante el rediseño (Fase 2); el modo oscuro real se reconstruye en su sesión aparte
  const [tab,setTab]=useState("home");
  const [loaded,setLoaded]=useState(false);
  const [syncMsg,setSyncMsg]=useState("Cargando…");
  const [vehicle,setVehicle]=useState({...INIT_V});
  const [records,setRecords]=useState([]);
  const [seeded,setSeeded]=useState(false); // true = el usuario ya tiene datos propios
  const [itvs,setItvs]=useState(DEFAULT_INT);
  const [vDraft,setVDraft]=useState({...INIT_V});
  const [form,setForm]=useState({...EMPTY_F});
  const [editId,setEditId]=useState(null);
  const [showRec,setShowRec]=useState(false);
  const [ifrm,setIfrm]=useState({...EMPTY_I});
  const [editIId,setEditIId]=useState(null);
  const [showItv,setShowItv]=useState(false);
  const [tFilt,setTFilt]=useState("all");
  const [tCatFilt,setTCatFilt]=useState("Todos");
  const [catFilt,setCatFilt]=useState("Todos");
  const [swUpd,setSwUpd]=useState(false);   // el SW cacheó una versión distinta
  const [canInst,setCanInst]=useState(false);
  const [iosTip,setIosTip]=useState(false); // iOS no emite beforeinstallprompt
  const [puedeInst,setPuedeInst]=useState(false); // hay prompt disponible, aunque el banner esté descartado
  const [stg,setStg]=useState(null);        // diagnóstico de almacenamiento; null = comprobando
  const [sw,setSw]=useState(null);          // diagnóstico del service worker
  const [swBusca,setSwBusca]=useState(null); // resultado de "Buscar actualización ahora"
  const pRef=useRef(null);                  // evento beforeinstallprompt diferido

  const vRef=useRef(vehicle),rRef=useRef(records),iRef=useRef(itvs);
  /* updatedAt pasa de ref a estado: ahora el aviso de respaldo lo compara
     contra la fecha del último export, así que tiene que provocar re-render. */
  const [updAt,setUpdAt]=useState(null);
  /* Fecha del último export. Clave propia, fuera de `automanto_v3`: es un dato
     de ESTE dispositivo, no del documento. Si viajara dentro del backup, un
     teléfono nuevo heredaría el contador del viejo al importar y creería estar
     respaldado sin estarlo. */
  const [lastExp,setLastExp]=useState(()=>{try{const v=localStorage.getItem(EK);return v?Number(v):null;}catch(_){return null;}});
  /* Si los datos de este dispositivo llegaron por importación, el aviso de
     "nunca exportaste" tiene que decir otra cosa: existe un archivo de origen,
     aunque no cubra lo editado después. Persiste en localStorage porque si no,
     recargar cambiaría el texto con los mismos datos. Tampoco viaja en el
     export: al importarlo, el dispositivo nuevo heredaría el `false` del
     dispositivo donde los datos se crearon a mano, que es justo lo contrario. */
  const [fromImp,setFromImp]=useState(()=>{try{return localStorage.getItem(IK)==="1";}catch(_){return false;}});
  // Nombre del propietario para el saludo. Local del dispositivo, no versionado.
  const [ownerName,setOwnerName]=useState(()=>{try{return localStorage.getItem(OWNK)||"";}catch(_){return"";}});
  const saveOwner=v=>{setOwnerName(v);try{localStorage.setItem(OWNK,v);}catch(_){}};
  useEffect(()=>{vRef.current=vehicle;},[vehicle]);
  useEffect(()=>{rRef.current=records;},[records]);
  useEffect(()=>{iRef.current=itvs;},[itvs]);

  useEffect(()=>{
    const mq=window.matchMedia("(prefers-color-scheme: dark)");
    setDark(mq.matches);
    const h=e=>setDark(e.matches);
    mq.addEventListener("change",h);
    return()=>mq.removeEventListener("change",h);
  },[]);

  useEffect(()=>{
    storageLoad().then(d=>{
      if(d){
        if(d.vehicle){setVehicle(d.vehicle);setVDraft(d.vehicle);}
        if(d.records)setRecords(d.records);
        if(d.itvs)setItvs(d.itvs);
        setUpdAt(d.updatedAt||null);
        setSeeded(true); // existe documento guardado ⇒ datos propios, nunca ejemplos
        setSyncMsg("Guardado ✓");
      }else{setSyncMsg("Listo");}
      setLoaded(true);
    });
  },[]);

  /* No bloquea el arranque: `loaded` no depende de esto. Mientras stg sea
     null el bloque de Config muestra un estado neutro, y si la consulta se
     cuelga, la carrera contra el temporizador lo saca de "Comprobando…". */
  useEffect(()=>{
    let vivo=true;
    const neutro={estado:"error",instalada:isStandalone(),usage:null,quota:null};
    const limite=new Promise(r=>setTimeout(()=>r(neutro),4000));
    Promise.race([checkPersistencia(),limite]).then(i=>{if(vivo)setStg(i);}).catch(()=>{if(vivo)setStg(neutro);});
    return()=>{vivo=false;};
  },[]);

  useEffect(()=>{let vivo=true;leerSW().then(d=>{if(vivo)setSw(d);});return()=>{vivo=false;};},[]);

  /* Pide al navegador que compruebe si sw.js cambió, y además compara el
     documento cacheado con el de red. Eso responde la pregunta que importa
     —¿hay versión nueva, y la app la está viendo?— sin depender de que el
     worker haya llegado a correr su revalidación. */
  const buscarActualizacion=async()=>{
    setSwBusca({estado:"buscando"});
    const r={estado:"listo",update:null,cache:null,red:null,iguales:null,error:null};
    try{
      const reg=await navigator.serviceWorker.getRegistration();
      if(!reg){r.error="No hay service worker registrado.";setSwBusca(r);return;}
      await reg.update();
      r.update=reg.installing?"instalando uno nuevo":reg.waiting?"hay uno esperando":"sin worker nuevo";
      const url=location.href.split("?")[0].split("#")[0];
      const c=await caches.match(new Request(url),{ignoreSearch:true});
      if(c){const t=await c.text();r.cache=hashCorto(t)+" · "+t.length+" B";}
      /* El parámetro único es imprescindible: sin él, esta petición la
         atiende el propio worker desde su caché y compararíamos la caché
         consigo misma. Con query distinta no casa con ninguna entrada y sale
         a la red de verdad. */
      const res=await fetch(new Request(url+"?diag="+Date.now(),{cache:"no-store",mode:"same-origin",credentials:"same-origin"}));
      const tr=await res.text();
      r.red=hashCorto(tr)+" · "+tr.length+" B";
      r.iguales=r.cache!==null&&r.cache===r.red;
    }catch(e){r.error=e&&e.message?e.message:String(e);}
    setSwBusca(r);
    setSw(await leerSW());
  };

  /* Instalación: Chrome/Android emiten beforeinstallprompt y podemos ofrecer
     el diálogo nativo. iOS no lo emite nunca, así que ahí sólo cabe explicar
     el gesto manual. Si ya está instalada, no molestamos. */
  useEffect(()=>{
    if(isStandalone())return;
    // El evento se captura siempre, aunque el banner esté descartado: si no,
    // el bloque de Config no tendría cómo ofrecer la instalación.
    // El descarte se relee en cada uso: si se descartó a mitad de sesión, un
    // valor capturado al montar estaría obsoleto y el banner volvería.
    const descartado=()=>{try{return localStorage.getItem(DK)==="1";}catch(_){return false;}};
    const hBip=e=>{e.preventDefault();pRef.current=e;setPuedeInst(true);if(!descartado())setCanInst(true);};
    const hIns=()=>{setCanInst(false);setIosTip(false);setPuedeInst(false);pRef.current=null;};
    window.addEventListener("beforeinstallprompt",hBip);
    window.addEventListener("appinstalled",hIns);
    if(isIOS()&&!descartado())setIosTip(true);
    return()=>{window.removeEventListener("beforeinstallprompt",hBip);window.removeEventListener("appinstalled",hIns);};
  },[]);

  /* Dos vías para enterarse de que hay versión nueva:
     - postMessage, si la página ya estaba abierta y escuchando.
     - la marca en caché, que el SW deja durante la navegación (normalmente
       antes de que este efecto corra, así que el mensaje se perdería).
       Se consume al leerla para que avise una sola vez.

     La marca se busca con caches.match(), que mira TODAS las cachés, en vez de
     abrir una por nombre. Antes se abría "automanto-v1" a mano y al subir el
     SW a v2 la marca dejó de encontrarse en silencio: la página no tiene por
     qué conocer el nombre de la caché del worker. */
  useEffect(()=>{
    if(!("serviceWorker" in navigator))return;
    const h=e=>{if(e.data&&e.data.type==="AUTOMANTO_UPDATE_READY")setSwUpd(true);};
    navigator.serviceWorker.addEventListener("message",h);
    (async()=>{
      try{
        const MARCA="https://automanto.local/update-pending";
        if(!(await caches.match(MARCA)))return;
        for(const k of await caches.keys()){const c=await caches.open(k);await c.delete(MARCA);}
        setSwUpd(true);
      }catch(_){}
    })();
    return()=>navigator.serviceWorker.removeEventListener("message",h);
  },[]);

  const doInstall=async()=>{
    const p=pRef.current;if(!p)return;
    p.prompt();await p.userChoice;
    pRef.current=null;setCanInst(false);setPuedeInst(false);
  };
  const dismissPWA=()=>{try{localStorage.setItem(DK,"1");}catch(_){}setCanInst(false);setIosTip(false);};

  const save=(v,r,i)=>{
    setSeeded(true);
    setSyncMsg("Guardando…");
    storageSave({vehicle:v??vRef.current,records:r??rRef.current,itvs:i??iRef.current}).then(u=>{setUpdAt(u);setSyncMsg("Guardado ✓");});
  };

  const D={
    dark:{
      bg:"#000000",bg2:"#1C1C1E",bg3:"#2C2C2E",bg4:"#3A3A3C",
      tx:"#FFFFFF",tx2:"rgba(235,235,245,0.8)",tx3:"rgba(235,235,245,0.6)",tx4:"rgba(235,235,245,0.36)",
      br:"#38383A",sp:"#38383A",
      ac:"#0A84FF",gr:"#30D158",rd:"#FF453A",or:"#FF9F0A",pu:"#BF5AF2",
      cd:"#1C1C1E",inp:"#2C2C2E",inpB:"#48484A",
      tb:"rgba(28,28,30,0.95)",nb:"rgba(0,0,0,0.9)",sg:"#1C1C1E",sgA:"#3A3A3C",
    },
    light:{
      bg:"#F2F2F7",bg2:"#FFFFFF",bg3:"#F2F2F7",bg4:"#E5E5EA",
      tx:"#000000",tx2:"rgba(60,60,67,0.8)",tx3:"rgba(60,60,67,0.55)",tx4:"rgba(60,60,67,0.3)",
      br:"#C6C6C8",sp:"#E5E5EA",
      ac:"#007AFF",gr:"#34C759",rd:"#FF3B30",or:"#FF9500",pu:"#AF52DE",
      cd:"#FFFFFF",inp:"#FFFFFF",inpB:"#C6C6C8",
      tb:"rgba(249,249,249,0.95)",nb:"rgba(242,242,247,0.95)",sg:"#E5E5EA",sgA:"#FFFFFF",
    }
  };
  const T=dark?D.dark:D.light;

  const km0=parseInt(vehicle.km)||0;

  /* Los ejemplos son sólo vista previa: se muestran mientras no haya datos
     propios, pero nunca entran en `records` y por tanto nunca se guardan.
     Lectura/visualización usan dispR; toda escritura usa records. */
  const demo=!seeded;
  const dispR=demo?SAMPLE_R:records;

  /* Un registro está suelto si no apunta a nada o si apunta a un intervalo que
     ya no existe — por ejemplo uno personalizado que se borró. El segundo caso
     no se veía: el id no era null, así que no salía el aviso, y no casaba con
     ningún intervalo, así que tampoco contaba en ninguna parte. */
  const itvById=useMemo(()=>new Map(itvs.map(x=>[x.id,x])),[itvs]);
  const suelto=r=>r.itvId==null||!itvById.has(r.itvId);

  const tracking=useMemo(()=>itvs.map(iv=>{
    const ms=dispR.filter(r=>r.itvId===iv.id).sort((a,b)=>new Date(b.date)-new Date(a.date)||b.km-a.km);
    const last=ms[0]||null,lKm=last?last.km:0,lDt=last?last.date:null;
    let kmL=null,dL=null,nKm=null,nDt=null;
    if(iv.km>0&&lKm>0){nKm=lKm+iv.km;kmL=km0>0?nKm-km0:null;}
    if(iv.days>0&&lDt){const nd=new Date(lDt);nd.setDate(nd.getDate()+iv.days);nDt=nd.toISOString().slice(0,10);dL=dDiff(nd,todayD);}
    let st="pending";
    if(last){st="ok";if((kmL!==null&&kmL<=0)||(dL!==null&&dL<=0))st="overdue";else if((kmL!==null&&iv.km>0&&kmL<=iv.km*0.15)||(dL!==null&&dL<=30))st="soon";}
    return{...iv,last,lKm,lDt,kmL,dL,nKm,nDt,st};
  }),[dispR,itvs,km0]);

  const ov=tracking.filter(t=>t.st==="overdue").length;
  const so=tracking.filter(t=>t.st==="soon").length;
  const ok=tracking.filter(t=>t.st==="ok").length;
  const ts=dispR.reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
  const fT=tracking.filter(t=>(tFilt==="all"||t.st===tFilt)&&(tCatFilt==="Todos"||t.cat===tCatFilt));
  const fR=[...dispR].sort((a,b)=>new Date(b.date)-new Date(a.date)||b.km-a.km).filter(r=>catFilt==="Todos"||r.cat===catFilt);

  const sc=s=>s==="overdue"?T.rd:s==="soon"?T.or:s==="ok"?T.gr:T.tx4;
  const sl=s=>s==="overdue"?"Vencido":s==="soon"?"Próximo":s==="ok"?"Al día":"Sin datos";

  /* ── Datos derivados para Inicio (Fase 2) ──
     Reusa `tracking`/`ov`/`so`/`ok` sin inventar umbrales. La lista de Inicio
     solo muestra intervalos con historial (los "pending" viven en Seguimiento),
     ordenados por urgencia: vencidos, luego próximos, luego al día; dentro de
     cada grupo, primero los de menor holgura. */
  const num=(v,f)=>v==null?f:v;
  const stPr=s=>s==="overdue"?0:s==="soon"?1:s==="ok"?2:3;
  const byUrg=(a,b)=>stPr(a.st)-stPr(b.st)||num(a.dL,Infinity)-num(b.dL,Infinity)||num(a.kmL,Infinity)-num(b.kmL,Infinity);
  const homeList=useMemo(()=>tracking.filter(t=>t.st!=="pending").sort(byUrg),[tracking]);
  const heroItem=homeList.find(t=>t.st==="overdue"||t.st==="soon")||null;
  // Texto de holgura corto para tarjetas y hero.
  const remOf=t=>t.kmL!=null?(t.kmL<=0?`+${Math.abs(t.kmL).toLocaleString()} km`:`${t.kmL.toLocaleString()} km`)
                :t.dL!=null?(t.dL<=0?`${Math.abs(t.dL)} d venc.`:`${t.dL} días`):"—";
  // Frase del hero (estado urgente): días si el intervalo es por tiempo, si no km.
  const heroSub=t=>{
    if(!t)return"";
    if(t.st==="overdue"){
      if(t.dL!=null&&t.dL<=0)return`Vencido hace ${Math.abs(t.dL)} días`;
      if(t.kmL!=null&&t.kmL<=0)return`Vencido por ${Math.abs(t.kmL).toLocaleString()} km`;
      return"Vencido";
    }
    if(t.dL!=null)return`Faltan ${t.dL} días`;
    if(t.kmL!=null)return`Faltan ${t.kmL.toLocaleString()} km`;
    return"Próximo";
  };
  // Progreso 0–100 del intervalo (consumo del ciclo). Presentación, no criterio de estado.
  const progOf=t=>{
    if(t.st==="overdue")return 100;
    let p=null;
    if(t.km>0&&t.lKm>0&&km0>0)p=(km0-t.lKm)/t.km*100;
    else if(t.days>0&&t.dL!=null)p=(1-t.dL/t.days)*100;
    return p==null?0:Math.max(4,Math.min(100,Math.round(p)));
  };
  // Saludo: solo si hay nombre guardado; se usa el primer nombre del campo.
  const firstName=ownerName.trim().split(/\s+/)[0]||"";
  const saludo=firstName?`${saludoHora()}, ${firstName}`:"";
  // Nombre (marca + modelo) y año separados: el nombre lleva el tratamiento
  // fuerte de .vname (21px/800/blue-900) y el año va discreto. Sin km, que ya
  // lo muestra el hero.
  const vehName=vehicle.brand?`${vehicle.brand} ${vehicle.model}`.trim():"";
  const vehYear=vehName&&vehicle.year?String(vehicle.year):"";

  /* form.itvId tiene tres valores posibles y cada uno significa algo distinto:
       undefined → todavía no se eligió nada (formulario nuevo)
       null      → "Otro", deliberadamente sin seguimiento
       string    → vinculado a ese intervalo                                  */
  const openAdd=()=>{setForm({...EMPTY_F,itvId:undefined});setEditId(null);setShowRec(true);};

  /* ⚠⚠ TEMPORAL — HERRAMIENTA DE PRUEBA. Borra los datos propios y vuelve al
     modo demo (SAMPLE_R) para poder probar el rediseño. QUITAR (función + su
     sección en Configuración) antes de dar por terminado el rediseño. */
  const resetDemo=()=>{
    if(!window.confirm("⚠ HERRAMIENTA DE PRUEBA\n\nEsto BORRA todos tus datos guardados (vehículo, registros e intervalos personalizados) y repone los datos de ejemplo.\n\nEsta acción no se puede deshacer. ¿Continuar?"))return;
    try{localStorage.removeItem(SK);}catch(_){}
    idbSet(null); // deja el almacén sin documento: al recargar, migrate(null) => modo demo
    setVehicle({...INIT_V});setVDraft({...INIT_V});setRecords([]);setItvs(DEFAULT_INT);
    setEditId(null);setShowRec(false);setSeeded(false);setUpdAt(null);
    setSyncMsg("Datos de ejemplo restaurados");
  };
  const openEdit=r=>{setForm({...r,itvId:r.itvId===undefined?null:r.itvId,km:String(r.km),amount:String(r.amount)});setEditId(r.id);setShowRec(true);};
  const pickItv=v=>{
    // Al pasar de un intervalo a "Otro" se limpia lo que se había
    // autocompletado: si no, el nombre y la categoría del intervalo abandonado
    // quedarían pegados a un servicio que no tiene nada que ver.
    if(v==="__otro"){setForm(x=>x.itvId?{...x,itvId:null,service:"",cat:""}:{...x,itvId:null});return;}
    const iv=itvs.find(i=>i.id===v);if(!iv)return;
    // Elegir el intervalo fija también la categoría: antes se podían desalinear
    // y la tarjeta salía con el color de otra categoría.
    setForm(x=>({...x,itvId:v,service:iv.name,cat:iv.cat}));
  };
  const recOK=!!form.date&&!!form.service&&form.itvId!==undefined;
  const saveRec=()=>{
    if(!recOK)return;
    const rec={...form,itvId:form.itvId??null,km:parseFloat(form.km)||0,amount:parseFloat(form.amount)||0};
    const next=editId?records.map(r=>r.id===editId?{...rec,id:editId}:r):[...records,{...rec,id:Date.now()}];
    setRecords(next);save(null,next,null);setShowRec(false);setEditId(null);
  };
  const delRec=id=>{const next=records.filter(r=>r.id!==id);setRecords(next);save(null,next,null);};
  /* Vincular un huérfano desde la lista, sin abrir el formulario entero. */
  const linkRec=(rid,itvId)=>{
    const iv=itvs.find(x=>x.id===itvId);if(!iv)return;
    const next=records.map(r=>r.id===rid?{...r,itvId,cat:iv.cat}:r);
    setRecords(next);save(null,next,null);
  };

  const openAddI=()=>{setIfrm({...EMPTY_I});setEditIId(null);setShowItv(true);};
  const openEditI=useCallback(x=>{setIfrm({name:x.name,cat:x.cat,km:String(x.km),days:String(x.days),note:x.note||""});setEditIId(x.id);setShowItv(true);},[records]);
  const saveItv=()=>{
    if(!ifrm.name||!ifrm.cat)return;
    const kv=parseInt(ifrm.km)||0,dv=parseInt(ifrm.days)||0;
    const prev=itvs.find(x=>x.id===editIId);
    const entry={cat:ifrm.cat,name:ifrm.name,km:kv,days:dv,note:ifrm.note,custom:prev?prev.custom:true};
    const nextItvs=editIId?itvs.map(x=>x.id===editIId?{...entry,id:editIId}:x):[...itvs,{...entry,id:newItvId()}];
    /* Aquí vivía la cascada que reescribía el `service` de los registros al
       renombrar un intervalo. Ya no hace falta: el vínculo es itvId y sobrevive
       al cambio de nombre. `service` se queda con lo que se escribió aquel día,
       que es lo que debe ser. */
    setItvs(nextItvs);save(null,null,nextItvs);setShowItv(false);setEditIId(null);
  };
  const delItv=useCallback(id=>{setItvs(prev=>{const next=prev.filter(x=>x.id!==id);save(null,null,next);return next;});},[]);
  const commitItv=useCallback((id,field,val)=>{
    setItvs(prev=>{const next=prev.map(x=>x.id===id?{...x,[field]:val}:x);save(null,null,next);return next;});
  },[]);

  const commitVehicle=field=>{const next={...vehicle,[field]:vDraft[field]};setVehicle(next);save(next,null,null);};

  /* Estado del respaldo. Lo que importa no es cuándo exportaste, sino si lo
     que tenés ahora está en alguna copia: por eso se compara updatedAt contra
     la fecha del export en vez de mirar sólo el tiempo transcurrido. Alguien
     que exportó y no volvió a tocar la app no tiene nada en riesgo, por muchos
     meses que pasen. */
  const haceCuanto=d=>d<=0?"hoy":d===1?"ayer":d<30?`hace ${d} días`:d<60?"hace un mes":d<365?`hace ${Math.floor(d/30)} meses`:"hace más de un año";
  const respaldo=(()=>{
    if(demo)return null;                       // no hay datos propios que perder
    // Mismo aviso y mismo color; sólo cambia la redacción cuando los datos
    // llegaron importados, porque ahí sí existe un archivo de origen.
    if(!lastExp)return fromImp
      ?{c:T.or,t:"No exportaste un respaldo desde este dispositivo",d:"Los datos llegaron por importación. Ese archivo respalda lo importado, pero no lo que edites desde acá."}
      :{c:T.or,t:"Nunca hiciste un respaldo",d:"Si perdés o reinicias el teléfono, estos datos no están en ningún otro sitio."};
    const dias=Math.floor((Date.now()-lastExp)/864e5);
    const cambio=updAt?new Date(updAt).getTime():null;
    if(!(cambio!=null&&cambio>lastExp))
      return{c:T.gr,t:"Respaldo al día",d:`No hubo cambios desde el último respaldo, ${haceCuanto(dias)}.`};
    return{
      c:dias>90?T.rd:dias>30?T.or:T.tx4,
      t:dias>30?"Tenés cambios sin respaldar":"Cambios sin respaldar",
      d:`Último respaldo ${haceCuanto(dias)}. Desde entonces editaste datos que no están en ninguna copia.`,
    };
  })();

  const exportData=()=>{
    // En modo ejemplo no hay nada guardado: descargar un backup vacío que
    // luego se pueda reimportar borraría la vista previa sin explicar nada.
    if(demo){alert("Todavía no hay nada que respaldar.\n\nLos registros que ves son ejemplos y no están guardados. Crea tu primer registro o completa los datos del vehículo, y vuelve a exportar.");return;}
    const data={vehicle,records,itvs,schemaVersion:SCHEMA,updatedAt:updAt,exportedAt:new Date().toISOString(),version:"1"};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=`automanto_backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();URL.revokeObjectURL(url);
    /* Se anota la descarga, no que el usuario haya conservado el archivo: el
       navegador no expone eso. Nótese que importar NO toca esta fecha, y es a
       propósito: un backup importado puede traer datos viejos, y haberlo
       importado no dice nada sobre si lo que edites después está a salvo. */
    const t=Date.now();
    try{localStorage.setItem(EK,String(t));}catch(_){}
    setLastExp(t);
  };

  const importData=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      const raw=pJSON(ev.target.result);
      if(!raw){alert("Archivo inválido: no es un JSON legible.");return;}
      if(!looksLikeBackup(raw)){alert("Ese archivo no parece un backup de Highway.\n\nNo se ha modificado nada.");return;}
      // Punto de entrada 2 de 3: se migra antes de preguntar, para que el
      // diálogo pueda contar los huérfanos reales y no una estimación.
      const d=migrate(raw);
      const sv=orphanCount(d);
      if(window.confirm(`¿Importar datos?\nEsto reemplazará tus registros actuales.\n\nVehículo: ${d.vehicle?.brand||"—"} ${d.vehicle?.model||""}\nRegistros: ${d.records?.length||0}\nIntervalos: ${d.itvs?.length||0}${sv?`\n\n⚠ ${sv} registro(s) quedarán sin vincular a ningún intervalo.\nSeguirán visibles y podrás vincularlos a mano.`:""}\n\nExportado: ${d.exportedAt?.slice(0,10)||"—"}`)){
        if(d.vehicle){setVehicle(d.vehicle);setVDraft(d.vehicle);}
        if(d.records)setRecords(d.records);
        if(d.itvs)setItvs(d.itvs);
        save(d.vehicle??vehicle,d.records??records,d.itvs??itvs);
        try{localStorage.setItem(IK,"1");}catch(_){}
        setFromImp(true);
        alert("✅ Datos importados correctamente");
      }
    };
    reader.readAsText(file);
    e.target.value="";
  };

  const importRef=useRef(null);

  /* Style helpers */
  const ff="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif";
  const card=(ex={})=>({background:T.cd,borderRadius:14,overflow:"hidden",...ex});
  const rrow=(ex={})=>({display:"flex",alignItems:"center",padding:"12px 16px",borderBottom:`0.5px solid ${T.sp}`,...ex});
  const inp=(ex={})=>({background:T.inp,color:T.tx,border:`1px solid ${T.inpB}`,borderRadius:10,padding:"10px 12px",fontSize:16,width:"100%",boxSizing:"border-box",outline:"none",...ex});
  const lbl={fontSize:13,color:T.tx3,display:"block",marginBottom:5};
  const sh={fontSize:12,fontWeight:600,color:T.tx3,textTransform:"uppercase",letterSpacing:0.6,marginBottom:8,paddingLeft:2};

  const TABS=[
    {id:"home",label:"Inicio",icon:"🏠",sym:"i-home"},
    {id:"track",label:"Seguimiento",icon:"⏱",sym:"i-clock"},
    {id:"records",label:"Registros",icon:"📋",sym:"i-list"},
    {id:"config",label:"Configuración",icon:"⚙️",sym:"i-settings"},
  ];

  if(!loaded)return(
    <div style={{background:T.bg,height:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16,fontFamily:ff}}>
      <div style={{fontSize:52}}>🚗</div>
      <div style={{fontSize:20,fontWeight:700,color:T.tx}}>Highway</div>
      <div style={{fontSize:14,color:T.tx3,marginTop:-8}}>Cargando datos...</div>
      <div style={{width:28,height:28,border:`3px solid ${T.bg3}`,borderTop:`3px solid ${T.ac}`,borderRadius:"50%",animation:"spin 0.8s linear infinite",marginTop:8}}/>
    </div>
  );

  return(
    <div className="hw-shell" style={{background:T.bg,color:T.tx,height:"100vh",fontFamily:ff,WebkitFontSmoothing:"antialiased"}}>

      {/* NAV LATERAL (escritorio, >=900px) */}
      <aside className="hw-side">
        <div className="d-brand"><img src="icon-192.png" alt="Highway"/><div><b>Highway</b><span>Mantenimiento</span></div></div>
        <nav className="d-nav">
          {TABS.map(t=>(
            <button key={t.id} className={"d-navi"+(tab===t.id?" active":"")} onClick={()=>setTab(t.id)}>
              <svg className="ic"><use href={`#${t.sym}`}/></svg>{t.label}
            </button>
          ))}
        </nav>
        <div className="hw-side-sp"/>
      </aside>

      <div className="hw-main">

      {/* HEADER — oculto en Inicio: esa pantalla trae su propio encabezado con saludo (Fase 2). Se redisena por pantalla en fases 3-4. */}
      {tab!=="home"&&<div style={{background:T.nb,flexShrink:0,padding:"0 16px 10px",paddingTop:"max(16px, env(safe-area-inset-top))",borderBottom:`0.5px solid ${T.br}`,zIndex:50}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{fontSize:22,fontWeight:700}}>{tab==="home"?"🚗 Panel":tab==="track"?"⏱ Seguimiento":tab==="records"?"📋 Registros":"⚙️ Configuración"}</div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            {tab==="records"&&<button onClick={openAdd} style={{background:T.ac,color:"#fff",border:"none",borderRadius:20,padding:"7px 16px",fontSize:14,fontWeight:600,cursor:"pointer"}}>+ Nuevo</button>}
            {tab==="config"&&<button onClick={openAddI} style={{background:T.gr,color:"#fff",border:"none",borderRadius:20,padding:"7px 16px",fontSize:14,fontWeight:600,cursor:"pointer"}}>+ Intervalo</button>}
            <button onClick={()=>setDark(d=>!d)} style={{background:T.bg3,border:"none",borderRadius:"50%",width:34,height:34,cursor:"pointer",fontSize:17,display:"flex",alignItems:"center",justifyContent:"center"}}>{dark?"☀️":"🌙"}</button>
          </div>
        </div>
        {vehicle.brand&&<div style={{fontSize:13,color:T.tx3,marginTop:3}}>{vehicle.brand} {vehicle.model} {vehicle.year}{km0>0?` · ${km0.toLocaleString()} km`:""}</div>}
        <div style={{display:"flex",alignItems:"center",gap:5,marginTop:4}}>
          <div style={{width:7,height:7,borderRadius:"50%",background:syncMsg.includes("…")?T.or:T.gr,flexShrink:0}}/>
          <div style={{fontSize:11,color:T.tx4}}>{syncMsg}</div>
        </div>
      </div>}

      {/* AVISO: NUEVA VERSIÓN */}
      {swUpd&&(
        <div style={{background:T.ac,flexShrink:0,padding:"9px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
          <div style={{fontSize:13,color:"#fff",fontWeight:500}}>Nueva versión disponible</div>
          <button onClick={()=>location.reload()} style={{background:"rgba(255,255,255,0.25)",color:"#fff",border:"none",borderRadius:16,padding:"5px 14px",fontSize:13,fontWeight:600,cursor:"pointer",flexShrink:0}}>Actualizar</button>
        </div>
      )}

      {/* AVISO: INSTALAR */}
      {(canInst||iosTip)&&(
        <div style={{background:T.bg2,flexShrink:0,borderBottom:`0.5px solid ${T.br}`,padding:"10px 16px",display:"flex",alignItems:"center",gap:10}}>
          <div style={{fontSize:20,flexShrink:0}}>📲</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,fontWeight:600,color:T.tx}}>Instalar Highway</div>
            <div style={{fontSize:11,color:T.tx3,marginTop:1}}>{canInst?"Acceso directo y uso sin conexión.":"Pulsa Compartir y luego «Añadir a pantalla de inicio»."}</div>
          </div>
          {canInst&&<button onClick={doInstall} style={{background:T.ac,color:"#fff",border:"none",borderRadius:16,padding:"6px 14px",fontSize:13,fontWeight:600,cursor:"pointer",flexShrink:0}}>Instalar</button>}
          <button onClick={dismissPWA} aria-label="Descartar" style={{background:T.bg4,border:"none",borderRadius:"50%",width:26,height:26,cursor:"pointer",color:T.tx3,fontSize:13,flexShrink:0}}>✕</button>
        </div>
      )}

      {/* SCROLL BODY */}
      <div style={{flex:1,overflowY:"auto",WebkitOverflowScrolling:"touch"}}>
        <div style={{padding:tab==="home"?0:"16px",paddingBottom:tab==="home"?0:24}}>

          {/* ── INICIO (Fase 2: móvil Variante A + escritorio, datos reales) ── */}
          {tab==="home"&&<>
            {/* --- MÓVIL: Variante A --- */}
            <div className="hw-mob a-wrap">
              {(saludo||vehName)&&(
                <div className="hw-greet">
                  {saludo&&<div className="hi">{saludoHora()}, <b>{firstName}</b></div>}
                  {vehName&&<div className="veh">{vehName}{vehYear&&<span className="yr"> · {vehYear}</span>}</div>}
                </div>
              )}
              {heroItem?(
                <div className="a-hero">
                  <div className="glow"/><div className="wm"><svg className="ic"><use href={`#${icoFor(heroItem.cat)}`}/></svg></div>
                  <span className="a-eyebrow"><svg className="ic"><use href="#i-alert"/></svg>Requiere atención</span>
                  <h2>{heroItem.name}</h2>
                  <div className="sub">{heroSub(heroItem)}</div>
                  <div className="meta">{heroItem.lDt?`Último: ${fmt(heroItem.lDt)}${heroItem.lKm>0?` · ${heroItem.lKm.toLocaleString()} km`:""}`:"Sin registro previo"}</div>
                  <div className="row">
                    <div className="a-odo"><b>{km0>0?`${km0.toLocaleString()} km`:"—"}</b>Odómetro actual</div>
                    <button className="a-cta" onClick={()=>setTab("track")}>Ver detalle <svg className="ic"><use href="#i-arrow"/></svg></button>
                  </div>
                </div>
              ):homeList.length>0?(
                <div className="a-hero ok">
                  <div className="glow"/><div className="wm"><svg className="ic"><use href="#i-check"/></svg></div>
                  <span className="a-eyebrow"><svg className="ic"><use href="#i-check"/></svg>Todo al día</span>
                  <h2>Sin pendientes</h2>
                  <div className="sub">Ningún servicio vencido ni próximo.</div>
                  <div className="meta">{ok} servicio{ok===1?"":"s"} al día</div>
                  <div className="row">
                    <div className="a-odo"><b>{km0>0?`${km0.toLocaleString()} km`:"—"}</b>Odómetro actual</div>
                    <button className="a-cta" onClick={()=>setTab("track")}>Ver seguimiento <svg className="ic"><use href="#i-arrow"/></svg></button>
                  </div>
                </div>
              ):(
                <div className="a-hero">
                  <div className="glow"/><div className="wm"><svg className="ic"><use href="#i-car"/></svg></div>
                  <span className="a-eyebrow"><svg className="ic"><use href="#i-alert"/></svg>Sin datos</span>
                  <h2>Empieza a registrar</h2>
                  <div className="sub">Agrega tu primer servicio para ver el estado del vehículo.</div>
                  <div className="row">
                    <div className="a-odo"><b>{km0>0?`${km0.toLocaleString()} km`:"—"}</b>Odómetro actual</div>
                    <button className="a-cta" onClick={openAdd}>Registrar <svg className="ic"><use href="#i-plus"/></svg></button>
                  </div>
                </div>
              )}
              <div className="a-chips">
                <div className="a-chip overdue"><span className="n">{ov}</span><span className="l">Vencidos</span></div>
                <div className="a-chip soon"><span className="n">{so}</span><span className="l">Próximos</span></div>
                <div className="a-chip ok"><span className="n">{ok}</span><span className="l">Al día</span></div>
              </div>
              <div className="sec-h"><h3>Servicios</h3></div>
              {homeList.length===0?(
                <div className="hw-note">Aún no hay servicios con historial. Toca + para registrar el primero.</div>
              ):(
                <div className="a-list">
                  {homeList.map(t=>(
                    <button key={t.id} className="a-card" onClick={()=>setTab("track")}>
                      <div className={`tile ${t.st}`}><svg className="ic"><use href={`#${icoFor(t.cat)}`}/></svg></div>
                      <div className="mid">
                        <div className="nm">{t.name}</div>
                        <div className="mt">Últ. {t.lKm>0?`${t.lKm.toLocaleString()} km`:fmt(t.lDt)} · Próx. {t.nKm?`${t.nKm.toLocaleString()} km`:t.nDt?fmt(t.nDt):"—"}</div>
                        <div className="prog"><i className={t.st} style={{width:`${progOf(t)}%`}}/></div>
                      </div>
                      <div className="rt"><span className={`badge ${t.st}`}><span className="bd"/>{sl(t.st)}</span><span className={`rem ${t.st}`}>{remOf(t)}</span></div>
                    </button>
                  ))}
                </div>
              )}
            </div>

            {/* --- ESCRITORIO --- */}
            <div className="hw-desk d-main2">
              <div className="d-topbar">
                <div className="tt">
                  {saludo&&<div className="k">{saludoHora()}, <b>{firstName}</b></div>}
                  <h2>{vehicle.brand?`${vehicle.brand} ${vehicle.model}`:"Mi vehículo"}{vehicle.year?<span className="yr"> · {vehicle.year}</span>:null}</h2>
                </div>
                <button className="d-btn" onClick={openAdd}><svg className="ic"><use href="#i-plus"/></svg>Registrar servicio</button>
              </div>
              <div className="d-upper">
                {heroItem?(
                  <div className="d-hero">
                    <div className="glow"/><div className="wm"><svg className="ic"><use href={`#${icoFor(heroItem.cat)}`}/></svg></div>
                    <span className="a-eyebrow"><svg className="ic"><use href="#i-alert"/></svg>Requiere atención</span>
                    <h3>{heroItem.name}</h3>
                    <div className="sub">{heroSub(heroItem)}</div>
                    <div className="meta">{heroItem.lDt?`Último: ${fmt(heroItem.lDt)}${heroItem.lKm>0?` · ${heroItem.lKm.toLocaleString()} km`:""}`:"Sin registro previo"}</div>
                    <div className="foot"><div className="odo"><b>{km0>0?`${km0.toLocaleString()} km`:"—"}</b><span>Odómetro actual</span></div><button onClick={()=>setTab("track")}>Ver detalle</button></div>
                  </div>
                ):homeList.length>0?(
                  <div className="d-hero ok">
                    <div className="glow"/><div className="wm"><svg className="ic"><use href="#i-check"/></svg></div>
                    <span className="a-eyebrow"><svg className="ic"><use href="#i-check"/></svg>Todo al día</span>
                    <h3>Sin pendientes</h3>
                    <div className="sub">Ningún servicio vencido ni próximo.</div>
                    <div className="meta">{ok} servicio{ok===1?"":"s"} al día</div>
                    <div className="foot"><div className="odo"><b>{km0>0?`${km0.toLocaleString()} km`:"—"}</b><span>Odómetro actual</span></div><button onClick={()=>setTab("track")}>Ver seguimiento</button></div>
                  </div>
                ):(
                  <div className="d-hero">
                    <div className="glow"/><div className="wm"><svg className="ic"><use href="#i-car"/></svg></div>
                    <span className="a-eyebrow"><svg className="ic"><use href="#i-alert"/></svg>Sin datos</span>
                    <h3>Empieza a registrar</h3>
                    <div className="sub">Agrega tu primer servicio para ver el estado del vehículo.</div>
                    <div className="foot"><div className="odo"><b>{km0>0?`${km0.toLocaleString()} km`:"—"}</b><span>Odómetro actual</span></div><button onClick={openAdd}>Registrar</button></div>
                  </div>
                )}
                <div className="d-side2">
                  <div className="d-scard overdue"><div className="n">{ov}</div><div className="tx"><b>Vencido{ov===1?"":"s"}</b><span>Atención inmediata</span></div><div className="dchip"><svg className="ic"><use href="#i-alert"/></svg></div></div>
                  <div className="d-scard soon"><div className="n">{so}</div><div className="tx"><b>Por vencer</b><span>Próximamente</span></div><div className="dchip"><svg className="ic"><use href="#i-bell"/></svg></div></div>
                  <div className="d-scard ok"><div className="n">{ok}</div><div className="tx"><b>Al día</b><span>Sin acción requerida</span></div><div className="dchip"><svg className="ic"><use href="#i-check"/></svg></div></div>
                </div>
              </div>
              <div className="sec-h"><h3>Servicios</h3></div>
              {homeList.length===0?(
                <div className="hw-note">Aún no hay servicios con historial. Usa «Registrar servicio» para empezar.</div>
              ):(
                <div className="d-grid">
                  {homeList.map(t=>(
                    <button key={t.id} className="d-card" onClick={()=>setTab("track")}>
                      <div className="ch"><div className={`tile ${t.st}`}><svg className="ic"><use href={`#${icoFor(t.cat)}`}/></svg></div><span className={`badge ${t.st}`}><span className="bd"/>{sl(t.st)}</span></div>
                      <div className="nm">{t.name}</div>
                      <div className={`rem ${t.st}`}>{remOf(t)}</div>
                      <div className="prog"><i className={t.st} style={{width:`${progOf(t)}%`}}/></div>
                      <div className="mt"><span>Últ. <b>{t.lKm>0?t.lKm.toLocaleString():fmt(t.lDt)}</b></span><span>Próx. <b>{t.nKm?t.nKm.toLocaleString():t.nDt?fmt(t.nDt):"—"}</b></span></div>
                    </button>
                  ))}
                </div>
              )}
            </div>
          </>}

          {/* ── SEGUIMIENTO ── */}
          {tab==="track"&&<>
            <div style={{display:"flex",background:T.sg,borderRadius:10,padding:3,marginBottom:10,gap:2}}>
              {[["all","Todos"],["overdue","Vencidos"],["soon","Próximos"],["ok","Al día"]].map(([v,l])=>(
                <button key={v} onClick={()=>setTFilt(v)} style={{flex:1,padding:"7px 4px",borderRadius:8,border:"none",cursor:"pointer",fontSize:12,fontWeight:tFilt===v?600:400,background:tFilt===v?T.sgA:"transparent",color:tFilt===v?T.tx:T.tx3}}>
                  {l}
                </button>
              ))}
            </div>
            <div style={{marginBottom:14,overflowX:"auto"}}>
              <div style={{display:"flex",gap:6,paddingBottom:2}}>
                {["Todos",...CATS].map(c=>{
                  const hasItems=c==="Todos"||c==="Otros"||tracking.some(t=>t.cat===c);
                  if(!hasItems)return null;
                  return(
                    <button key={c} onClick={()=>setTCatFilt(c)} style={{padding:"5px 12px",borderRadius:20,border:"none",cursor:"pointer",fontSize:12,fontWeight:tCatFilt===c?600:400,background:tCatFilt===c?(CC[c]||T.ac):T.bg3,color:tCatFilt===c?"#fff":T.tx2,whiteSpace:"nowrap",flexShrink:0,opacity:1}}>
                      {c}
                    </button>
                  );
                })}
              </div>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {fT.map(t=>{
                const c=sc(t.st);
                return(
                  <div key={t.id} style={{...card(),borderLeft:`3px solid ${c}`}}>
                    <div style={{padding:"12px 14px"}}>
                      <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:8,marginBottom:6}}>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontWeight:600,fontSize:15,color:T.tx,marginBottom:4}}>{t.name}</div>
                          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                            <span style={{fontSize:10,padding:"2px 8px",borderRadius:20,background:`${CC[t.cat]||"#636366"}33`,color:CC[t.cat]||"#636366",fontWeight:500}}>{t.cat}</span>
                            <span style={{fontSize:10,padding:"2px 8px",borderRadius:20,background:`${c}22`,color:c,fontWeight:600}}>{sl(t.st)}</span>
                          </div>
                        </div>
                        <div style={{textAlign:"right",flexShrink:0}}>
                          {t.kmL!==null&&<div style={{fontSize:16,fontWeight:700,color:c}}>{t.kmL<=0?`+${Math.abs(t.kmL).toLocaleString()}`:t.kmL.toLocaleString()} km</div>}
                          {t.dL!==null&&<div style={{fontSize:12,color:c,fontWeight:500}}>{t.dL<=0?`${Math.abs(t.dL)}d vencido`:`${t.dL} días`}</div>}
                          {t.kmL===null&&t.dL===null&&<div style={{fontSize:12,color:T.tx4}}>sin datos</div>}
                        </div>
                      </div>
                      <div style={{display:"flex",gap:16,flexWrap:"wrap",paddingTop:8,borderTop:`0.5px solid ${T.sp}`}}>
                        {[
                          ["Último km",t.lKm>0?t.lKm.toLocaleString()+"km":"—"],
                          ["Último",t.lDt?fmt(t.lDt):"—"],
                          t.nKm?["Próximo km",t.nKm.toLocaleString()+"km"]:null,
                          t.nDt?["Próxima fecha",fmt(t.nDt)]:null,
                        ].filter(Boolean).map(([k,v])=>(
                          <div key={k}>
                            <div style={{fontSize:10,color:T.tx4,textTransform:"uppercase",letterSpacing:.3}}>{k}</div>
                            <div style={{fontSize:13,fontWeight:500,color:T.tx2}}>{v}</div>
                          </div>
                        ))}
                      </div>
                      {t.last&&<div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:8}}>
                        <div style={{fontSize:12,color:T.tx3}}>Por <b style={{color:T.tx2}}>{t.last.by}</b> · ${(t.last.amount||0).toFixed(2)}</div>
                        {!demo&&<button onClick={()=>openEdit(t.last)} style={{fontSize:11,color:T.ac,background:"none",border:`0.5px solid ${T.ac}66`,borderRadius:20,padding:"3px 10px",cursor:"pointer",fontWeight:500}}>Editar</button>}
                      </div>}
                    </div>
                  </div>
                );
              })}
            </div>
          </>}

          {/* ── REGISTROS ── */}
          {tab==="records"&&<>
            <div style={{marginBottom:12,overflowX:"auto"}}>
              <div style={{display:"flex",gap:6,paddingBottom:4}}>
                {["Todos",...CATS].map(c=>(
                  <button key={c} onClick={()=>setCatFilt(c)} style={{padding:"6px 14px",borderRadius:20,border:"none",cursor:"pointer",fontSize:13,fontWeight:catFilt===c?600:400,background:catFilt===c?T.ac:T.bg3,color:catFilt===c?"#fff":T.tx2,whiteSpace:"nowrap",flexShrink:0}}>
                    {c}
                  </button>
                ))}
              </div>
            </div>
            {demo&&<div style={{...card({marginBottom:10}),padding:"12px 14px",borderLeft:`3px solid ${T.or}`}}>
              <div style={{fontWeight:600,fontSize:14,color:T.tx}}>Datos de ejemplo</div>
              <div style={{fontSize:12,color:T.tx3,marginTop:2}}>Sólo para que veas cómo funciona. No se guardan y desaparecerán al crear tu primer registro.</div>
            </div>}
            {fR.length===0&&<div style={{...card(),padding:"32px 16px",textAlign:"center",color:T.tx3,fontSize:15}}>Sin registros.</div>}
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {fR.map(r=>(
                <div key={r.id} style={{...card(),opacity:demo?0.65:1}}>
                  <div style={{padding:"12px 14px"}}>
                    <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:4}}>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontWeight:600,fontSize:15,color:T.tx}}>{r.service}</div>
                        {/* El nombre del intervalo sólo cuando difiere del texto
                            del registro: si coinciden, repetirlo es ruido. Al
                            renombrar un intervalo el registro conserva su texto
                            original, y esta línea es la que cierra el vínculo. */}
                        {(()=>{const iv=itvById.get(r.itvId);return iv&&iv.name!==r.service
                          ?<div style={{fontSize:11,color:T.tx4,marginTop:2}}>Intervalo: <span style={{color:T.tx3,fontWeight:500}}>{iv.name}</span></div>
                          :null;})()}
                        {r.desc&&<div style={{fontSize:13,color:T.tx3,marginTop:1}}>{r.desc}</div>}
                      </div>
                      <div style={{fontWeight:700,fontSize:16,marginLeft:12,color:T.tx}}>${(r.amount||0).toFixed(2)}</div>
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:6,marginTop:8,flexWrap:"wrap"}}>
                      <span style={{fontSize:10,padding:"2px 8px",borderRadius:20,background:`${CC[r.cat]||"#636366"}33`,color:CC[r.cat]||"#636366",fontWeight:500}}>{r.cat}</span>
                      <span style={{fontSize:12,color:T.tx3}}>{fmt(r.date)}</span>
                      <span style={{fontSize:12,color:T.tx3}}>{(r.km||0).toLocaleString()} km</span>
                      <span style={{fontSize:12,color:T.tx3}}>{r.by}</span>
                    </div>
                    {suelto(r)&&!demo&&(
                      <div style={{display:"flex",alignItems:"center",gap:10,marginTop:10,padding:"9px 11px",background:`${T.or}14`,border:`0.5px solid ${T.or}44`,borderRadius:10,flexWrap:"wrap"}}>
                        <div style={{flex:1,minWidth:130}}>
                          <div style={{fontSize:12,fontWeight:600,color:T.or}}>Sin seguimiento</div>
                          <div style={{fontSize:11,color:T.tx3,marginTop:1,lineHeight:1.35}}>{r.itvId==null?"No cuenta para ningún intervalo.":"El intervalo al que apuntaba ya no existe."}</div>
                        </div>
                        <select value="" onChange={e=>{if(e.target.value)linkRec(r.id,e.target.value);}} style={{...inp({padding:"6px 8px",fontSize:12,width:"auto"}),maxWidth:180,flexShrink:0}}>
                          <option value="">Vincular a…</option>
                          {itvs.map(i=><option key={i.id} value={i.id}>{i.name}</option>)}
                        </select>
                      </div>
                    )}
                  </div>
                  {!demo&&<div style={{display:"flex",borderTop:`0.5px solid ${T.sp}`}}>
                    <button onClick={()=>openEdit(r)} style={{flex:1,padding:"10px",background:"none",border:"none",cursor:"pointer",fontSize:14,color:T.ac,fontWeight:500,borderRight:`0.5px solid ${T.sp}`}}>Editar</button>
                    <button onClick={()=>delRec(r.id)} style={{flex:1,padding:"10px",background:"none",border:"none",cursor:"pointer",fontSize:14,color:T.rd,fontWeight:500}}>Eliminar</button>
                  </div>}
                </div>
              ))}
            </div>
            {dispR.length>0&&<div style={{...card({marginTop:12}),padding:"14px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontSize:15,color:T.tx2}}>Total invertido</span>
              <span style={{fontSize:18,fontWeight:700,color:T.gr}}>${ts.toLocaleString("es",{minimumFractionDigits:2})}</span>
            </div>}
          </>}

          {/* ── CONFIG ── */}
          {tab==="config"&&<>
            <div style={sh}>Vehículo</div>
            <div style={{...card(),marginBottom:20}}>
              {[["owner","Propietario","text","Juan Pérez"],["brand","Marca","text","Toyota"],["model","Modelo","text","Corolla"],["year","Año","number","2019"],["plate","Matrícula","text","ABC-1234"],["color","Color","text","Blanco"],["vin","VIN","text","1HGCM..."],["km","Km actuales","number","50000"],["garage","Taller","text","AutoShop"],["phone","Teléfono","tel","+1 555 0100"]].map(([field,label,type,ph],i,a)=>(
                <div key={field} style={{...rrow({borderBottom:i<a.length-1?`0.5px solid ${T.sp}`:"none",gap:12})}}>
                  <div style={{width:96,fontSize:14,color:T.tx3,flexShrink:0}}>{label}</div>
                  <input type={type} value={vDraft[field]} onChange={e=>setVDraft(d=>({...d,[field]:e.target.value}))} onBlur={()=>commitVehicle(field)} placeholder={ph} style={{background:"transparent",color:T.tx,border:"none",textAlign:"right",padding:0,fontSize:15,flex:1,outline:"none"}}/>
                </div>
              ))}
            </div>
            {itvs.filter(x=>x.custom).length>0&&<>
              <div style={{...sh,color:T.pu}}>Personalizados</div>
              <div style={{...card(),marginBottom:12}}>
                {itvs.filter(x=>x.custom).map((iv,i,a)=>(
                  <div key={iv.id} style={{borderBottom:i<a.length-1?`0.5px solid ${T.sp}`:"none"}}>
                    <IRow iv={iv} T={T} onCommit={commitItv} onEdit={openEditI} onDelete={delItv}/>
                  </div>
                ))}
              </div>
            </>}
            {/* Exportar / Importar */}
            <div style={sh}>Respaldo de datos</div>
            <div style={{...card(),marginBottom:20}}>
              <div style={{...rrow({borderBottom:`0.5px solid ${T.sp}`}),justifyContent:"space-between"}}>
                <div>
                  <div style={{fontWeight:500,fontSize:15,color:T.tx}}>Exportar datos</div>
                  <div style={{fontSize:12,color:T.tx3,marginTop:1}}>Descarga un archivo .json con todo</div>
                </div>
                <button onClick={exportData} style={{background:T.ac,color:"#fff",border:"none",borderRadius:20,padding:"7px 16px",fontSize:14,fontWeight:600,cursor:"pointer"}}>📤 Exportar</button>
              </div>
              <div style={{...rrow({borderBottom:respaldo?`0.5px solid ${T.sp}`:"none"}),justifyContent:"space-between"}}>
                <div>
                  <div style={{fontWeight:500,fontSize:15,color:T.tx}}>Importar datos</div>
                  <div style={{fontSize:12,color:T.tx3,marginTop:1}}>Carga un backup .json previo</div>
                </div>
                <button onClick={()=>importRef.current.click()} style={{background:T.gr,color:"#fff",border:"none",borderRadius:20,padding:"7px 16px",fontSize:14,fontWeight:600,cursor:"pointer"}}>📥 Importar</button>
              </div>
              {respaldo&&(
                <div style={{...rrow({borderBottom:"none"}),gap:11,alignItems:"flex-start"}}>
                  <div style={{width:9,height:9,borderRadius:"50%",background:respaldo.c,flexShrink:0,marginTop:5}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:500,fontSize:14,color:T.tx}}>{respaldo.t}</div>
                    <div style={{fontSize:11,color:T.tx3,marginTop:2,lineHeight:1.45}}>{respaldo.d}</div>
                  </div>
                </div>
              )}
              <input ref={importRef} type="file" accept=".json" onChange={importData} style={{display:"none"}}/>
            </div>

            {/* ── Estado del almacenamiento ── */}
            {(()=>{
              const e=stg?stg.estado:null;
              const V={
                null :{c:T.tx4,t:"Comprobando almacenamiento…",d:"Un momento."},
                error:{c:T.tx4,t:"No se pudo comprobar",d:"El navegador no respondió a tiempo. Tus datos siguen guardados igual."},
                na   :{c:T.tx4,t:"No disponible en este navegador",d:"Tu versión no permite consultarlo (hace falta iOS 17 o superior). Exportá tus datos de vez en cuando."},
                ok   :{c:T.gr ,t:"Almacenamiento protegido",d:"El navegador se compromete a no borrar tus datos para liberar espacio."},
                no   :stg&&stg.instalada
                  ?{c:T.or,t:"Protección parcial",d:aplicaPurga7d()
                      ?"La app está instalada, que es lo que te libra del borrado por inactividad. El navegador no concedió además la marca de persistencia."
                      :"La app está instalada. El navegador no concedió además la marca de persistencia, así que podría borrar datos si necesitara espacio."}
                  :{c:T.rd,t:"Sin proteger",d:aplicaPurga7d()
                      ?"Safari borra los datos de las pestañas tras unos 7 días sin abrir el sitio. Instalá la app para que eso deje de aplicarte."
                      :"El navegador puede borrar los datos si necesita espacio. Instalar la app hace que los trate como permanentes."},
              };
              const v=V[e]||V[null];
              const accionable=e==="no"&&stg&&!stg.instalada;
              return(
                <>
                  <div style={sh}>Almacenamiento</div>
                  <div style={{...card(),marginBottom:20}}>
                    <div style={{...rrow({borderBottom:(accionable||(stg&&stg.usage!=null))?`0.5px solid ${T.sp}`:"none"}),gap:11,alignItems:"flex-start"}}>
                      <div style={{width:9,height:9,borderRadius:"50%",background:v.c,flexShrink:0,marginTop:5}}/>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontWeight:500,fontSize:15,color:T.tx}}>{v.t}</div>
                        <div style={{fontSize:12,color:T.tx3,marginTop:2,lineHeight:1.45}}>{v.d}</div>
                      </div>
                    </div>
                    {accionable&&(
                      <div style={{...rrow({borderBottom:stg&&stg.usage!=null?`0.5px solid ${T.sp}`:"none"}),justifyContent:"space-between",gap:10}}>
                        <div style={{fontSize:12,color:T.tx3,flex:1,minWidth:0}}>
                          {puedeInst
                            ?(aplicaPurga7d()?"Instalala y el contador de 7 días deja de aplicarte.":"Instalala para que el navegador conserve sus datos.")
                            :comoInstalar()}
                        </div>
                        {puedeInst&&<button onClick={doInstall} style={{background:T.ac,color:"#fff",border:"none",borderRadius:16,padding:"6px 14px",fontSize:13,fontWeight:600,cursor:"pointer",flexShrink:0}}>Instalar</button>}
                      </div>
                    )}
                    {stg&&stg.usage!=null&&(
                      <div style={{...rrow({borderBottom:"none"}),justifyContent:"space-between"}}>
                        <span style={{fontSize:13,color:T.tx3}}>Espacio usado</span>
                        <span style={{fontSize:13,color:T.tx2,fontWeight:500}}>{fmtBytes(stg.usage)}{stg.quota!=null?` de ${fmtBytes(stg.quota)}`:""}</span>
                      </div>
                    )}
                  </div>
                </>
              );
            })()}

            {/* ── Diagnóstico del service worker ── */}
            {(()=>{
              const fila=(k,v,col)=>(
                <div key={k} style={{...rrow({borderBottom:`0.5px solid ${T.sp}`,padding:"9px 16px"}),gap:10,alignItems:"flex-start"}}>
                  <div style={{fontSize:12,color:T.tx3,width:132,flexShrink:0}}>{k}</div>
                  <div style={{fontSize:12,color:col||T.tx2,flex:1,minWidth:0,wordBreak:"break-word",fontWeight:col?600:400}}>{v}</div>
                </div>
              );
              const b=swBusca;
              return(
                <>
                  <div style={sh}>Service worker</div>
                  <div style={{...card(),marginBottom:20}}>
                    {!sw?fila("Estado","Leyendo…"):!sw.soportado?fila("Estado","No soportado en este navegador",T.rd):[
                      fila("Controlando",sw.controlada||"NO — la página no está bajo el worker",sw.controlada?null:T.rd),
                      fila("Activo",sw.active||"ninguno",sw.active?null:T.rd),
                      fila("Esperando",sw.waiting||"ninguno",sw.waiting?T.or:null),
                      fila("Instalando",sw.installing||"ninguno",sw.installing?T.or:null),
                      fila("Cachés",sw.caches.length?sw.caches.join(", "):"ninguna",sw.caches.length?null:T.rd),
                      fila("Marca pendiente",sw.marca?"sí — hay versión nueva sin avisar":"no",sw.marca?T.or:null),
                      fila("Documento en caché",sw.doc?`${sw.doc.huella} · ${sw.doc.bytes} B`:"no está cacheado",sw.doc?null:T.rd),
                      sw.error?fila("Error",sw.error,T.rd):null,
                    ].filter(Boolean)}

                    {b&&b.estado==="listo"&&[
                      fila("Última búsqueda",b.error?b.error:b.update,b.error?T.rd:null),
                      b.red?fila("En el servidor",b.red):null,
                      b.iguales!==null?fila("¿Coinciden?",b.iguales?"sí — ya tenés la última":"NO — el servidor tiene otra versión",b.iguales?T.gr:T.or):null,
                    ].filter(Boolean)}

                    <div style={{...rrow({borderBottom:"none"}),justifyContent:"space-between",gap:10}}>
                      <div style={{fontSize:11,color:T.tx4,flex:1,minWidth:0,lineHeight:1.4}}>
                        El navegador no expone cuándo comprobó por su cuenta si hay versión nueva. Esto lo pregunta ahora.
                      </div>
                      <button onClick={buscarActualizacion} disabled={b&&b.estado==="buscando"} style={{background:b&&b.estado==="buscando"?T.bg4:T.ac,color:b&&b.estado==="buscando"?T.tx3:"#fff",border:"none",borderRadius:16,padding:"6px 14px",fontSize:13,fontWeight:600,cursor:"pointer",flexShrink:0}}>
                        {b&&b.estado==="buscando"?"Buscando…":"Buscar ahora"}
                      </button>
                    </div>
                  </div>
                </>
              );
            })()}

            <div style={sh}>Predefinidos</div>
            <div style={card()}>
              {itvs.filter(x=>!x.custom).map((iv,i,a)=>(
                <div key={iv.id} style={{borderBottom:i<a.length-1?`0.5px solid ${T.sp}`:"none"}}>
                  <IRow iv={iv} T={T} onCommit={commitItv} onEdit={openEditI} onDelete={delItv}/>
                </div>
              ))}
            </div>

            {/* ⚠⚠ TEMPORAL — HERRAMIENTA DE PRUEBA. QUITAR antes de terminar el rediseño. */}
            <div style={{...sh,color:T.rd,marginTop:22}}>Herramienta de prueba — temporal</div>
            <div style={{...card(),border:`1px dashed ${T.rd}`,padding:16}}>
              <div style={{fontSize:13,color:T.tx2,marginBottom:12,lineHeight:1.5}}>Borra todos los datos guardados y repone los datos de ejemplo. Solo sirve para probar el rediseño; se eliminará antes de terminarlo.</div>
              <button onClick={resetDemo} style={{background:"transparent",color:T.rd,border:`1px solid ${T.rd}`,borderRadius:12,padding:"11px 16px",fontSize:14,fontWeight:600,cursor:"pointer",width:"100%"}}>♻︎ Reiniciar a datos de ejemplo</button>
            </div>
          </>}

        </div>
      </div>

      {/* BARRA INFERIOR (móvil, <900px) — el FAB central abre el mismo flujo de alta que ya existía */}
      <div className="hw-tabbar">
        <button className={"hw-tab"+(tab==="home"?" on":"")} onClick={()=>setTab("home")}><svg className="ic"><use href="#i-home"/></svg>Inicio</button>
        <button className={"hw-tab"+(tab==="track"?" on":"")} onClick={()=>setTab("track")}><svg className="ic"><use href="#i-clock"/></svg>Seguimiento</button>
        <button className="hw-fab" onClick={openAdd} aria-label="Agregar registro"><svg className="ic"><use href="#i-plus"/></svg></button>
        <button className={"hw-tab"+(tab==="records"?" on":"")} onClick={()=>setTab("records")}><svg className="ic"><use href="#i-list"/></svg>Registros</button>
        <button className={"hw-tab"+(tab==="config"?" on":"")} onClick={()=>setTab("config")}><svg className="ic"><use href="#i-settings"/></svg>Configuración</button>
      </div>

      </div>{/* /hw-main */}

      {/* MODAL: REGISTRO */}
      {showRec&&(
        <div onClick={()=>{setShowRec(false);setEditId(null);}} style={{position:"fixed",inset:0,zIndex:200,background:"rgba(1,18,44,0.5)",backdropFilter:"blur(3px)",WebkitBackdropFilter:"blur(3px)",display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
          <div onClick={e=>e.stopPropagation()} style={{background:T.bg2,borderRadius:"26px 26px 0 0",width:"100%",maxWidth:520,maxHeight:"90vh",overflowY:"auto",WebkitOverflowScrolling:"touch",paddingBottom:32,boxShadow:"0 -14px 40px rgba(1,42,102,0.22)"}}>
            <div style={{width:38,height:4,borderRadius:999,background:T.br,margin:"8px auto 2px"}}/>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 20px 12px",position:"sticky",top:0,background:T.bg2,zIndex:1}}>
              <div style={{fontWeight:800,fontSize:18,color:T.tx,letterSpacing:"-0.02em"}}>{editId?"Editar registro":"Nuevo registro"}</div>
              <button onClick={()=>{setShowRec(false);setEditId(null);}} style={{background:T.bg4,border:"none",borderRadius:10,width:32,height:32,cursor:"pointer",color:T.tx3,fontSize:16}}>✕</button>
            </div>
            <div style={{padding:"16px 20px",display:"flex",flexDirection:"column",gap:14}}>
              {[
                {f:"service",l:"Servicio / Pieza",t:"itv"},
                {f:"cat",l:"Categoría",t:"select"},
                {f:"date",l:"Fecha",t:"date"},
                {f:"km",l:"Km al realizar",t:"number",ph:"ej. 47500"},
                {f:"by",l:"Realizado por",t:"text",ph:"Nombre del mecánico"},
                {f:"place",l:"Taller / Lugar",t:"text",ph:"Nombre del taller"},
                {f:"amount",l:"Monto ($)",t:"number",ph:"0.00"},
                {f:"desc",l:"Descripción",t:"area",ph:"Describe el servicio..."},
                {f:"notes",l:"Notas",t:"area",ph:"Observaciones..."},
              ].map(({f,l,t,ph,list})=>(
                <div key={f}>
                  <label style={lbl}>{l}</label>
                  {t==="itv"?(
                    <>
                      <select value={form.itvId===undefined?"":form.itvId===null?"__otro":form.itvId} onChange={e=>pickItv(e.target.value)} style={inp()}>
                        <option value="" disabled>Seleccionar…</option>
                        {itvs.map(i=><option key={i.id} value={i.id}>{i.name}</option>)}
                        <option value="__otro">Otro (sin seguimiento)</option>
                      </select>
                      {form.itvId===null&&(
                        <>
                          <input value={form.service} onChange={e=>setForm(x=>({...x,service:e.target.value}))} placeholder="¿Qué se hizo?" style={inp({marginTop:8})}/>
                          <div style={{fontSize:11,color:T.tx4,marginTop:4,lineHeight:1.4}}>Quedará registrado y sumará al gasto, pero no contará para ningún intervalo.</div>
                        </>
                      )}
                    </>
                  ):t==="select"?(
                    <select value={form.cat} onChange={e=>setForm(x=>({...x,cat:e.target.value}))} style={inp()}>
                      <option value="">Seleccionar...</option>
                      {CATS.map(c=><option key={c}>{c}</option>)}
                    </select>
                  ):t==="area"?(
                    <textarea value={form[f]} onChange={e=>setForm(x=>({...x,[f]:e.target.value}))} rows={2} placeholder={ph} style={{...inp({resize:"vertical",lineHeight:1.5})}}/>
                  ):(
                    <>
                      <input list={list} type={t} value={form[f]} onChange={e=>setForm(x=>({...x,[f]:e.target.value}))} placeholder={ph} style={inp()}/>
                      {list&&<datalist id={list}>{itvs.map(i=><option key={i.id} value={i.name}/>)}</datalist>}
                    </>
                  )}
                </div>
              ))}
              <button onClick={saveRec} disabled={!recOK} style={{padding:"14px",background:recOK?T.ac:T.bg4,color:recOK?"#fff":T.tx3,border:"none",borderRadius:12,cursor:"pointer",fontWeight:700,fontSize:17}}>
                {editId?"Guardar cambios":"Agregar registro"}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* MODAL: INTERVALO */}
      {showItv&&(
        <div style={{position:"fixed",inset:0,zIndex:200,background:"rgba(0,0,0,0.6)",display:"flex",alignItems:"flex-end"}}>
          <div style={{background:T.bg2,borderRadius:"20px 20px 0 0",width:"100%",maxHeight:"85vh",overflowY:"auto",WebkitOverflowScrolling:"touch",paddingBottom:32}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"16px 20px 12px",position:"sticky",top:0,background:T.bg2,zIndex:1,borderBottom:`0.5px solid ${T.br}`}}>
              <div style={{fontWeight:700,fontSize:18,color:T.tx}}>{editIId?"Editar intervalo":"Nuevo intervalo"}</div>
              <button onClick={()=>{setShowItv(false);setEditIId(null);}} style={{background:T.bg4,border:"none",borderRadius:"50%",width:30,height:30,cursor:"pointer",color:T.tx,fontSize:16}}>✕</button>
            </div>
            <div style={{padding:"16px 20px",display:"flex",flexDirection:"column",gap:14}}>
              <div><label style={lbl}>Nombre *</label><input value={ifrm.name} onChange={e=>setIfrm(x=>({...x,name:e.target.value}))} placeholder="ej. Limpieza de inyectores" style={inp()}/></div>
              <div>
                <label style={lbl}>Categoría *</label>
                <select value={ifrm.cat} onChange={e=>setIfrm(x=>({...x,cat:e.target.value}))} style={inp()}>
                  <option value="">Seleccionar...</option>
                  {CATS.map(c=><option key={c}>{c}</option>)}
                </select>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                <div><label style={lbl}>Cada (km)</label><input type="number" value={ifrm.km} onChange={e=>setIfrm(x=>({...x,km:e.target.value}))} placeholder="0" style={{...inp({textAlign:"center"})}}/></div>
                <div><label style={lbl}>Cada (días)</label><input type="number" value={ifrm.days} onChange={e=>setIfrm(x=>({...x,days:e.target.value}))} placeholder="0" style={{...inp({textAlign:"center"})}}/></div>
              </div>
              <div><label style={lbl}>Nota</label><input value={ifrm.note} onChange={e=>setIfrm(x=>({...x,note:e.target.value}))} placeholder="Descripción breve..." style={inp()}/></div>
              <button onClick={saveItv} disabled={!ifrm.name||!ifrm.cat} style={{padding:"14px",background:(!ifrm.name||!ifrm.cat)?T.bg4:T.gr,color:(!ifrm.name||!ifrm.cat)?T.tx3:"#fff",border:"none",borderRadius:12,cursor:"pointer",fontWeight:700,fontSize:17}}>
                {editIId?"Guardar cambios":"Crear intervalo"}
              </button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<script>
/* Registro del service worker.
   Se guarda el esquema: en file:// no existen los service workers, así que
   abrir index.html con doble clic sigue funcionando sin errores en consola. */
if("serviceWorker" in navigator && (location.protocol==="https:"||location.protocol==="http:")){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
