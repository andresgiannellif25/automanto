<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef, useCallback } = React;

/* ── Storage ── */
const SK="automanto_v3", IDB_NAME="automanto_db", SCHEMA=2;
function idbOpen(){return new Promise((res,rej)=>{try{const r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=e=>e.target.result.createObjectStore("kv");r.onsuccess=e=>res(e.target.result);r.onerror=()=>rej();}catch(e){rej(e);}});}
async function idbGet(){try{const db=await idbOpen();return await new Promise((res,rej)=>{const tx=db.transaction("kv","readonly");const r=tx.objectStore("kv").get(SK);r.onsuccess=()=>res(r.result??null);r.onerror=()=>rej();});}catch{return null;}}
async function idbSet(val){try{const db=await idbOpen();await new Promise((res,rej)=>{const tx=db.transaction("kv","readwrite");tx.objectStore("kv").put(val,SK);tx.oncomplete=()=>res();tx.onerror=()=>rej();});return true;}catch{return false;}}
const lsGet=()=>{try{return localStorage.getItem(SK);}catch{return null;}};
const lsSet=v=>{try{localStorage.setItem(SK,v);}catch{}};
const pJSON=s=>{try{if(s)return JSON.parse(s);}catch{}return null;};
// Punto de entrada 1 de 3: todo lo que se lee de disco pasa por migrate().
async function storageLoad(){const fast=pJSON(lsGet());if(fast)return migrate(fast);return migrate(pJSON(await idbGet()));}
async function storageSave(data){const st={...data,schemaVersion:SCHEMA,updatedAt:new Date().toISOString()};const j=JSON.stringify(st);lsSet(j);await idbSet(j);return st.updatedAt;}

/* ── Constants ── */
const INIT_V={owner:"",brand:"",model:"",year:"",plate:"",color:"",vin:"",km:"",garage:"",phone:""};
const EMPTY_F={service:"",cat:"",desc:"",date:"",km:"",by:"",place:"",amount:"",notes:""};
const EMPTY_I={name:"",cat:"",km:"",days:"",note:""};

const DEFAULT_INT=[
  {id:"oil-engine",cat:"Filtros",name:"Aceite de motor",km:5000,days:180,note:"Sintético puede llegar a 7,500 km",custom:false},
  {id:"oil-filter",cat:"Filtros",name:"Filtro de aceite",km:5000,days:180,note:"Cambiar junto con aceite",custom:false},
  {id:"air-filter",cat:"Filtros",name:"Filtro de aire",km:15000,days:365,note:"Revisar condición cada 10,000 km",custom:false},
  {id:"fuel-filter",cat:"Filtros",name:"Filtro de combustible",km:30000,days:730,note:"Gasolina; diesel cada 15,000 km",custom:false},
  {id:"cabin-filter",cat:"Filtros",name:"Filtro de habitáculo",km:15000,days:365,note:"Polvo / carbón activado",custom:false},
  {id:"coolant",cat:"Fluidos",name:"Líquido refrigerante",km:40000,days:730,note:"Revisar nivel cada 10,000 km",custom:false},
  {id:"brake-fluid",cat:"Fluidos",name:"Líquido de frenos",km:30000,days:730,note:"DOT 4 – higroscópico",custom:false},
  {id:"transmission-fluid",cat:"Fluidos",name:"Fluido de transmisión",km:40000,days:0,note:"Automática: revisión 30,000 km",custom:false},
  {id:"brake-pads-front",cat:"Frenos",name:"Pastillas delanteras",km:25000,days:0,note:"Revisar grosor cada 15,000 km",custom:false},
  {id:"brake-pads-rear",cat:"Frenos",name:"Pastillas traseras",km:35000,days:0,note:"Suelen durar más que delanteras",custom:false},
  {id:"brake-discs",cat:"Frenos",name:"Discos de freno",km:60000,days:0,note:"Medir espesor mínimo",custom:false},
  {id:"shock-absorbers",cat:"Suspensión",name:"Amortiguadores",km:80000,days:0,note:"Revisar fugas u oscilación",custom:false},
  {id:"ball-joints",cat:"Suspensión",name:"Rótulas / Bieletas",km:60000,days:0,note:"Inspección en cada alineación",custom:false},
  {id:"tire-rotation",cat:"Neumáticos",name:"Rotación de llantas",km:8000,days:180,note:"Cruzada para desgaste uniforme",custom:false},
  {id:"wheel-alignment",cat:"Neumáticos",name:"Alineación y balanceo",km:10000,days:365,note:"Después de golpes fuertes",custom:false},
  {id:"tire-replacement",cat:"Neumáticos",name:"Sustitución neumáticos",km:50000,days:1825,note:"Según profundidad de labrado",custom:false},
  {id:"spark-plugs",cat:"Motor",name:"Bujías",km:30000,days:0,note:"Platino: 60k / Iridio: 100k km",custom:false},
  {id:"timing-belt",cat:"Motor",name:"Banda de distribución",km:60000,days:1825,note:"Crítico – no omitir",custom:false},
  {id:"serpentine-belt",cat:"Motor",name:"Banda de accesorios",km:60000,days:1825,note:"Revisar tensión y grietas",custom:false},
  {id:"battery",cat:"Eléctrico",name:"Batería",km:0,days:1460,note:"Revisar voltaje cada 2 años",custom:false},
  {id:"alternator",cat:"Eléctrico",name:"Alternador",km:0,days:1825,note:"Revisar con batería",custom:false},
  {id:"ac-condenser-clean",cat:"Aire Acondicionado",name:"Limpieza condensador",km:20000,days:365,note:"Antes de temporada de calor",custom:false},
  {id:"ac-refrigerant",cat:"Aire Acondicionado",name:"Recarga gas refrigerante",km:0,days:730,note:"R134a o R1234yf",custom:false},
  {id:"general-inspection",cat:"Inspección",name:"Revisión técnica general",km:0,days:365,note:"Según regulación local",custom:false},
];

/* Equivalencia entre los ids numéricos 1–24 de v1 y los slugs estables de v2.
   El migrador mapea por este id numérico y NO por el nombre: el nombre pudo
   haberse renombrado, el id numérico sobrevivió a cualquier renombre. */
const LEGACY_ID={
  1:"oil-engine",2:"oil-filter",3:"air-filter",4:"fuel-filter",5:"cabin-filter",
  6:"coolant",7:"brake-fluid",8:"transmission-fluid",
  9:"brake-pads-front",10:"brake-pads-rear",11:"brake-discs",
  12:"shock-absorbers",13:"ball-joints",
  14:"tire-rotation",15:"wheel-alignment",16:"tire-replacement",
  17:"spark-plugs",18:"timing-belt",19:"serpentine-belt",
  20:"battery",21:"alternator",
  22:"ac-condenser-clean",23:"ac-refrigerant",24:"general-inspection",
};

/* ── Migración de esquema ──
   Es aditiva y no destruye nada: añade `itvId` a los registros y conserva
   `record.service` como etiqueta histórica. Eso da compatibilidad en ambos
   sentidos: un backup v1 se convierte al vuelo, y un documento v2 abierto por
   un build v1 sigue funcionando porque v1 lee `service`, que nunca se borra. */
const newItvId=()=>{
  try{if(typeof crypto!=="undefined"&&crypto.randomUUID)return crypto.randomUUID();}catch(_){}
  // randomUUID exige contexto seguro; en file:// no existe.
  return "itv-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);
};

/* Lleva un documento cualquiera a la forma v2, mire lo que mire su etiqueta.
   Cada decisión es local: un intervalo con id de tipo string ya está migrado;
   un registro que ya tiene la clave itvId se respeta tal cual, incluso si vale
   null (es un huérfano conocido, y C3 dará la acción para vincularlo a mano).
   Por eso es idempotente y puede aplicarse cuantas veces haga falta. */
function toV2(d){
  /* Si el documento no trae lista de intervalos, se parte de los de fábrica:
     es lo que la app usaría de todos modos. Devolver [] dejaría al usuario sin
     ningún intervalo, porque un array vacío pasa el guardia `if(d.itvs)`. */
  const itvs=Array.isArray(d.itvs)?d.itvs:DEFAULT_INT;
  const nItvs=itvs.map(x=>{
    if(typeof x.id==="string"&&x.id)return{...x};   // ya tiene id estable
    const slug=x.custom?null:LEGACY_ID[x.id];
    return{...x,id:slug||newItvId()};
  });
  // Último uso del vínculo por nombre: de aquí en adelante manda itvId.
  const byName=new Map();
  nItvs.forEach(x=>{if(!byName.has(x.name))byName.set(x.name,x.id);});
  const recs=Array.isArray(d.records)?d.records:[];
  const nRecs=recs.map(r=>("itvId" in r)?{...r}:{...r,itvId:byName.has(r.service)?byName.get(r.service):null});
  return{...d,itvs:nItvs,records:nRecs,schemaVersion:2};
}

function migrate(doc){
  if(!doc||typeof doc!=="object"||Array.isArray(doc))return doc;
  /* No se mira schemaVersion a propósito. Ese campo es una etiqueta, y una
     etiqueta puede mentir: un documento marcado como v2 pero sin itvId se
     saltaría la migración y quedaría sin vincular en silencio, para siempre.
     toV2 decide elemento por elemento y es idempotente, así que aplicarlo
     siempre no cuesta nada y no depende de que nadie haya etiquetado bien. */
  return toV2(doc);
}

/* Registros que quedarían sin vincular. Lo muestra el diálogo de importar
   para que la decisión se tome viendo el coste, no a ciegas. */
const orphanCount=d=>(Array.isArray(d&&d.records)?d.records:[]).filter(r=>r.itvId==null).length;

/* Un JSON válido no es un backup de AutoManto. Sin esto, cualquier .json
   suelto reemplazaría los datos del usuario en cuanto confirmara el diálogo. */
const looksLikeBackup=d=>!!d&&typeof d==="object"&&!Array.isArray(d)&&(d.vehicle!==undefined||Array.isArray(d.records)||Array.isArray(d.itvs));

/* Punto de entrada 3 de 3: los datos semilla nacen ya en v2, con itvId. */
const SAMPLE_R=[
  {id:1,itvId:"oil-engine",service:"Aceite de motor",cat:"Filtros",desc:"Cambio aceite 5W-30 sintético + filtro",date:"2024-06-15",km:45000,by:"AutoShop Pérez",place:"Taller Central",amount:35,notes:"Próximo a 50,000 km"},
  {id:2,itvId:"brake-pads-front",service:"Pastillas delanteras",cat:"Frenos",desc:"Sustitución pastillas freno delantero",date:"2024-08-20",km:47500,by:"AutoShop Pérez",place:"Taller Central",amount:80,notes:"Revisar discos próximo cambio"},
  {id:3,itvId:"tire-rotation",service:"Rotación de llantas",cat:"Neumáticos",desc:"Rotación cruzada + calibración presión",date:"2024-09-01",km:48000,by:"Llantería Norte",place:"Llantería Norte",amount:15,notes:"Presión: 32 PSI"},
];

const CATS=["Motor","Transmisión","Frenos","Suspensión","Eléctrico","Neumáticos","Filtros","Fluidos","Carrocería","Aire Acondicionado","Inspección","Otros"];
const CC={Motor:"#FF6B35",Transmisión:"#FF453A",Frenos:"#FF453A",Suspensión:"#BF5AF2",Eléctrico:"#FFD60A",Neumáticos:"#30D158",Filtros:"#0A84FF",Fluidos:"#64D2FF",Carrocería:"#98989E","Aire Acondicionado":"#30D158",Inspección:"#636366",Otros:"#98989E"};

/* ── PWA ── */
const DK="automanto_pwa_dismiss";
const EK="automanto_last_export";   // fecha del último export, por dispositivo
const IK="automanto_from_import";   // los datos de este dispositivo llegaron importados
const isIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const isStandalone=()=>window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;

/* Safari de verdad. Ojo: casi todos los UA llevan "Safari/537.36", incluido
   Chrome, así que hay que excluir los motores Chromium explícitamente. */
const isSafari=()=>{const ua=navigator.userAgent;return /Safari\//.test(ua)&&!/Chrome\/|Chromium\/|Edg\/|OPR\/|Android/.test(ua);};

/* El borrado a los ~7 días es de WebKit/ITP: aplica en Safari y en todo iOS,
   donde cualquier navegador usa WebKit por obligación. En Chrome o Firefox de
   escritorio el riesgo es otro: desalojo si hace falta espacio. Advertir de
   los 7 días donde no aplica sería mentirle al usuario. */
const aplicaPurga7d=()=>isIOS()||isSafari();

/* Cómo se instala en este navegador. Que no haya prompt nativo NO implica que
   estemos en iOS: puede ser Firefox, un shell embebido, o que las heurísticas
   del navegador todavía no lo hayan ofrecido. */
const comoInstalar=()=>isIOS()?"Pulsá Compartir y luego «Añadir a pantalla de inicio»."
  :isSafari()?"En Safari: menú Archivo → «Añadir al Dock»."
  :"Buscá «Instalar aplicación» o «Añadir a la pantalla de inicio» en el menú de tu navegador.";

/* Persistencia del almacenamiento (deuda #4).
   persist() es un PEDIDO, no una orden: el navegador decide y puede negarlo.
   WebKit lo concede por heurísticas, sobre todo si la app está instalada en
   pantalla de inicio; en una pestaña normal de Safari lo normal es que lo
   deniegue. Por eso se registra el resultado real: dar por hecho que quedó
   concedida sería el mismo error que nos trajo hasta aquí.
   Ojo: esto NO es la defensa contra el borrado a los 7 días de ITP. Esa
   exención la da estar instalada en pantalla de inicio, no esta llamada. */
async function checkPersistencia(){
  const info={estado:"na",instalada:isStandalone(),usage:null,quota:null};
  try{
    if(!navigator.storage||!navigator.storage.persist){
      console.info("[AutoManto] Storage API no disponible (Safari <17 o file://): no se puede pedir persistencia.");
      return info;
    }
    let ok=await navigator.storage.persisted();
    const yaEstaba=ok;
    if(!ok)ok=await navigator.storage.persist();
    info.estado=ok?"ok":"no";
    console.info(`[AutoManto] Almacenamiento persistente: ${ok?"CONCEDIDO":"DENEGADO"}`
      +` · app ${info.instalada?"instalada":"en pestaña del navegador"}`
      +(yaEstaba?" · ya lo estaba":"")
      +(ok?"":" · instalar en pantalla de inicio es lo que más ayuda a que se conceda"));
    if(navigator.storage.estimate){
      const e=await navigator.storage.estimate();
      info.usage=e.usage??null;info.quota=e.quota??null;
      console.info(`[AutoManto] Uso: ${Math.round((e.usage||0)/1024)} KB de ${Math.round((e.quota||0)/1048576)} MB`);
    }
  }catch(err){
    console.warn("[AutoManto] No se pudo consultar la persistencia:",err&&err.message);
    info.estado="error";
  }
  return info;
}

/* Bytes en unidades que se puedan leer de un vistazo. */
const fmtBytes=n=>{
  if(n==null||!isFinite(n))return"—";
  if(n<1024)return n+" B";
  if(n<1048576)return (n/1024).toFixed(n<10240?1:0)+" KB";
  if(n<1073741824)return (n/1048576).toFixed(n<10485760?1:0)+" MB";
  return (n/1073741824).toFixed(1)+" GB";
};

const todayD=new Date();
const fmt=d=>{if(!d)return"—";const p=d.split("-");return`${p[2]}/${p[1]}/${p[0]}`;};
const dDiff=(a,b)=>Math.round((new Date(a)-new Date(b))/(864e5));

function IRow({iv,T,onCommit,onEdit,onDelete}){
  const kmRef=useRef(null),dayRef=useRef(null);
  const fs={background:T.inp,color:T.tx,border:`1px solid ${T.inpB}`,borderRadius:10,padding:"8px 10px",fontSize:15,width:"100%",boxSizing:"border-box",outline:"none",textAlign:"center"};
  const hKb=()=>{const n=parseInt(kmRef.current.value)||0;kmRef.current.value=String(n);onCommit(iv.id,"km",n);};
  const hDb=()=>{const n=parseInt(dayRef.current.value)||0;dayRef.current.value=String(n);onCommit(iv.id,"days",n);};
  return(
    <div style={{padding:"10px 14px"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:500,fontSize:14,color:T.tx,display:"flex",alignItems:"center",gap:5,flexWrap:"wrap"}}>
            {iv.name}
            {iv.custom&&<span style={{fontSize:10,padding:"1px 6px",borderRadius:8,background:`${T.pu}33`,color:T.pu,fontWeight:600}}>personalizado</span>}
          </div>
          {iv.note&&<div style={{fontSize:11,color:T.tx4,marginTop:1}}>{iv.note}</div>}
        </div>
        <div style={{display:"flex",gap:5,flexShrink:0,marginLeft:8,alignItems:"center"}}>
          <span style={{fontSize:10,padding:"2px 7px",borderRadius:20,background:`${CC[iv.cat]||"#636366"}33`,color:CC[iv.cat]||"#636366",fontWeight:500}}>{iv.cat}</span>
          <button onClick={()=>onEdit(iv)} style={{fontSize:11,color:T.ac,background:"none",border:`0.5px solid ${T.ac}66`,borderRadius:14,padding:"2px 8px",cursor:"pointer"}}>Editar</button>
          {iv.custom&&<button onClick={()=>onDelete(iv.id)} style={{fontSize:11,color:T.rd,background:"none",border:`0.5px solid ${T.rd}66`,borderRadius:14,padding:"2px 8px",cursor:"pointer"}}>✕</button>}
        </div>
      </div>
      <div style={{display:"flex",gap:8}}>
        <div style={{flex:1}}>
          <div style={{fontSize:11,color:T.tx4,marginBottom:3}}>Cada (km)</div>
          <input ref={kmRef} type="text" inputMode="numeric" defaultValue={String(iv.km)} onBlur={hKb} style={fs}/>
        </div>
        <div style={{flex:1}}>
          <div style={{fontSize:11,color:T.tx4,marginBottom:3}}>Cada (días)</div>
          <input ref={dayRef} type="text" inputMode="numeric" defaultValue={String(iv.days)} onBlur={hDb} style={fs}/>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [dark,setDark]=useState(true);
  const [tab,setTab]=useState("home");
  const [loaded,setLoaded]=useState(false);
  const [syncMsg,setSyncMsg]=useState("Cargando…");
  const [vehicle,setVehicle]=useState({...INIT_V});
  const [records,setRecords]=useState([]);
  const [seeded,setSeeded]=useState(false); // true = el usuario ya tiene datos propios
  const [itvs,setItvs]=useState(DEFAULT_INT);
  const [vDraft,setVDraft]=useState({...INIT_V});
  const [form,setForm]=useState({...EMPTY_F});
  const [editId,setEditId]=useState(null);
  const [showRec,setShowRec]=useState(false);
  const [ifrm,setIfrm]=useState({...EMPTY_I});
  const [editIId,setEditIId]=useState(null);
  const [showItv,setShowItv]=useState(false);
  const [tFilt,setTFilt]=useState("all");
  const [tCatFilt,setTCatFilt]=useState("Todos");
  const [catFilt,setCatFilt]=useState("Todos");
  const [swUpd,setSwUpd]=useState(false);   // el SW cacheó una versión distinta
  const [canInst,setCanInst]=useState(false);
  const [iosTip,setIosTip]=useState(false); // iOS no emite beforeinstallprompt
  const [puedeInst,setPuedeInst]=useState(false); // hay prompt disponible, aunque el banner esté descartado
  const [stg,setStg]=useState(null);        // diagnóstico de almacenamiento; null = comprobando
  const pRef=useRef(null);                  // evento beforeinstallprompt diferido

  const vRef=useRef(vehicle),rRef=useRef(records),iRef=useRef(itvs);
  /* updatedAt pasa de ref a estado: ahora el aviso de respaldo lo compara
     contra la fecha del último export, así que tiene que provocar re-render. */
  const [updAt,setUpdAt]=useState(null);
  /* Fecha del último export. Clave propia, fuera de `automanto_v3`: es un dato
     de ESTE dispositivo, no del documento. Si viajara dentro del backup, un
     teléfono nuevo heredaría el contador del viejo al importar y creería estar
     respaldado sin estarlo. */
  const [lastExp,setLastExp]=useState(()=>{try{const v=localStorage.getItem(EK);return v?Number(v):null;}catch(_){return null;}});
  /* Si los datos de este dispositivo llegaron por importación, el aviso de
     "nunca exportaste" tiene que decir otra cosa: existe un archivo de origen,
     aunque no cubra lo editado después. Persiste en localStorage porque si no,
     recargar cambiaría el texto con los mismos datos. Tampoco viaja en el
     export: al importarlo, el dispositivo nuevo heredaría el `false` del
     dispositivo donde los datos se crearon a mano, que es justo lo contrario. */
  const [fromImp,setFromImp]=useState(()=>{try{return localStorage.getItem(IK)==="1";}catch(_){return false;}});
  useEffect(()=>{vRef.current=vehicle;},[vehicle]);
  useEffect(()=>{rRef.current=records;},[records]);
  useEffect(()=>{iRef.current=itvs;},[itvs]);

  useEffect(()=>{
    const mq=window.matchMedia("(prefers-color-scheme: dark)");
    setDark(mq.matches);
    const h=e=>setDark(e.matches);
    mq.addEventListener("change",h);
    return()=>mq.removeEventListener("change",h);
  },[]);

  useEffect(()=>{
    storageLoad().then(d=>{
      if(d){
        if(d.vehicle){setVehicle(d.vehicle);setVDraft(d.vehicle);}
        if(d.records)setRecords(d.records);
        if(d.itvs)setItvs(d.itvs);
        setUpdAt(d.updatedAt||null);
        setSeeded(true); // existe documento guardado ⇒ datos propios, nunca ejemplos
        setSyncMsg("Guardado ✓");
      }else{setSyncMsg("Listo");}
      setLoaded(true);
    });
  },[]);

  /* No bloquea el arranque: `loaded` no depende de esto. Mientras stg sea
     null el bloque de Config muestra un estado neutro, y si la consulta se
     cuelga, la carrera contra el temporizador lo saca de "Comprobando…". */
  useEffect(()=>{
    let vivo=true;
    const neutro={estado:"error",instalada:isStandalone(),usage:null,quota:null};
    const limite=new Promise(r=>setTimeout(()=>r(neutro),4000));
    Promise.race([checkPersistencia(),limite]).then(i=>{if(vivo)setStg(i);}).catch(()=>{if(vivo)setStg(neutro);});
    return()=>{vivo=false;};
  },[]);

  /* Instalación: Chrome/Android emiten beforeinstallprompt y podemos ofrecer
     el diálogo nativo. iOS no lo emite nunca, así que ahí sólo cabe explicar
     el gesto manual. Si ya está instalada, no molestamos. */
  useEffect(()=>{
    if(isStandalone())return;
    // El evento se captura siempre, aunque el banner esté descartado: si no,
    // el bloque de Config no tendría cómo ofrecer la instalación.
    // El descarte se relee en cada uso: si se descartó a mitad de sesión, un
    // valor capturado al montar estaría obsoleto y el banner volvería.
    const descartado=()=>{try{return localStorage.getItem(DK)==="1";}catch(_){return false;}};
    const hBip=e=>{e.preventDefault();pRef.current=e;setPuedeInst(true);if(!descartado())setCanInst(true);};
    const hIns=()=>{setCanInst(false);setIosTip(false);setPuedeInst(false);pRef.current=null;};
    window.addEventListener("beforeinstallprompt",hBip);
    window.addEventListener("appinstalled",hIns);
    if(isIOS()&&!descartado())setIosTip(true);
    return()=>{window.removeEventListener("beforeinstallprompt",hBip);window.removeEventListener("appinstalled",hIns);};
  },[]);

  /* Dos vías para enterarse de que hay versión nueva:
     - postMessage, si la página ya estaba abierta y escuchando.
     - la marca en caché, que el SW deja durante la navegación (normalmente
       antes de que este efecto corra, así que el mensaje se perdería).
       Se consume al leerla para que avise una sola vez. */
  useEffect(()=>{
    if(!("serviceWorker" in navigator))return;
    const h=e=>{if(e.data&&e.data.type==="AUTOMANTO_UPDATE_READY")setSwUpd(true);};
    navigator.serviceWorker.addEventListener("message",h);
    (async()=>{
      try{
        const c=await caches.open("automanto-v1");
        if(await c.match("https://automanto.local/update-pending")){
          await c.delete("https://automanto.local/update-pending");
          setSwUpd(true);
        }
      }catch(_){}
    })();
    return()=>navigator.serviceWorker.removeEventListener("message",h);
  },[]);

  const doInstall=async()=>{
    const p=pRef.current;if(!p)return;
    p.prompt();await p.userChoice;
    pRef.current=null;setCanInst(false);setPuedeInst(false);
  };
  const dismissPWA=()=>{try{localStorage.setItem(DK,"1");}catch(_){}setCanInst(false);setIosTip(false);};

  const save=(v,r,i)=>{
    setSeeded(true);
    setSyncMsg("Guardando…");
    storageSave({vehicle:v??vRef.current,records:r??rRef.current,itvs:i??iRef.current}).then(u=>{setUpdAt(u);setSyncMsg("Guardado ✓");});
  };

  const D={
    dark:{
      bg:"#000000",bg2:"#1C1C1E",bg3:"#2C2C2E",bg4:"#3A3A3C",
      tx:"#FFFFFF",tx2:"rgba(235,235,245,0.8)",tx3:"rgba(235,235,245,0.6)",tx4:"rgba(235,235,245,0.36)",
      br:"#38383A",sp:"#38383A",
      ac:"#0A84FF",gr:"#30D158",rd:"#FF453A",or:"#FF9F0A",pu:"#BF5AF2",
      cd:"#1C1C1E",inp:"#2C2C2E",inpB:"#48484A",
      tb:"rgba(28,28,30,0.95)",nb:"rgba(0,0,0,0.9)",sg:"#1C1C1E",sgA:"#3A3A3C",
    },
    light:{
      bg:"#F2F2F7",bg2:"#FFFFFF",bg3:"#F2F2F7",bg4:"#E5E5EA",
      tx:"#000000",tx2:"rgba(60,60,67,0.8)",tx3:"rgba(60,60,67,0.55)",tx4:"rgba(60,60,67,0.3)",
      br:"#C6C6C8",sp:"#E5E5EA",
      ac:"#007AFF",gr:"#34C759",rd:"#FF3B30",or:"#FF9500",pu:"#AF52DE",
      cd:"#FFFFFF",inp:"#FFFFFF",inpB:"#C6C6C8",
      tb:"rgba(249,249,249,0.95)",nb:"rgba(242,242,247,0.95)",sg:"#E5E5EA",sgA:"#FFFFFF",
    }
  };
  const T=dark?D.dark:D.light;

  const km0=parseInt(vehicle.km)||0;

  /* Los ejemplos son sólo vista previa: se muestran mientras no haya datos
     propios, pero nunca entran en `records` y por tanto nunca se guardan.
     Lectura/visualización usan dispR; toda escritura usa records. */
  const demo=!seeded;
  const dispR=demo?SAMPLE_R:records;

  /* Un registro está suelto si no apunta a nada o si apunta a un intervalo que
     ya no existe — por ejemplo uno personalizado que se borró. El segundo caso
     no se veía: el id no era null, así que no salía el aviso, y no casaba con
     ningún intervalo, así que tampoco contaba en ninguna parte. */
  const itvById=useMemo(()=>new Map(itvs.map(x=>[x.id,x])),[itvs]);
  const suelto=r=>r.itvId==null||!itvById.has(r.itvId);

  const tracking=useMemo(()=>itvs.map(iv=>{
    const ms=dispR.filter(r=>r.itvId===iv.id).sort((a,b)=>new Date(b.date)-new Date(a.date)||b.km-a.km);
    const last=ms[0]||null,lKm=last?last.km:0,lDt=last?last.date:null;
    let kmL=null,dL=null,nKm=null,nDt=null;
    if(iv.km>0&&lKm>0){nKm=lKm+iv.km;kmL=km0>0?nKm-km0:null;}
    if(iv.days>0&&lDt){const nd=new Date(lDt);nd.setDate(nd.getDate()+iv.days);nDt=nd.toISOString().slice(0,10);dL=dDiff(nd,todayD);}
    let st="pending";
    if(last){st="ok";if((kmL!==null&&kmL<=0)||(dL!==null&&dL<=0))st="overdue";else if((kmL!==null&&iv.km>0&&kmL<=iv.km*0.15)||(dL!==null&&dL<=30))st="soon";}
    return{...iv,last,lKm,lDt,kmL,dL,nKm,nDt,st};
  }),[dispR,itvs,km0]);

  const ov=tracking.filter(t=>t.st==="overdue").length;
  const so=tracking.filter(t=>t.st==="soon").length;
  const ok=tracking.filter(t=>t.st==="ok").length;
  const ts=dispR.reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
  const fT=tracking.filter(t=>(tFilt==="all"||t.st===tFilt)&&(tCatFilt==="Todos"||t.cat===tCatFilt));
  const fR=[...dispR].sort((a,b)=>new Date(b.date)-new Date(a.date)||b.km-a.km).filter(r=>catFilt==="Todos"||r.cat===catFilt);

  const sc=s=>s==="overdue"?T.rd:s==="soon"?T.or:s==="ok"?T.gr:T.tx4;
  const sl=s=>s==="overdue"?"Vencido":s==="soon"?"Próximo":s==="ok"?"Al día":"Sin datos";

  /* form.itvId tiene tres valores posibles y cada uno significa algo distinto:
       undefined → todavía no se eligió nada (formulario nuevo)
       null      → "Otro", deliberadamente sin seguimiento
       string    → vinculado a ese intervalo                                  */
  const openAdd=()=>{setForm({...EMPTY_F,itvId:undefined});setEditId(null);setShowRec(true);};
  const openEdit=r=>{setForm({...r,itvId:r.itvId===undefined?null:r.itvId,km:String(r.km),amount:String(r.amount)});setEditId(r.id);setShowRec(true);};
  const pickItv=v=>{
    // Al pasar de un intervalo a "Otro" se limpia lo que se había
    // autocompletado: si no, el nombre y la categoría del intervalo abandonado
    // quedarían pegados a un servicio que no tiene nada que ver.
    if(v==="__otro"){setForm(x=>x.itvId?{...x,itvId:null,service:"",cat:""}:{...x,itvId:null});return;}
    const iv=itvs.find(i=>i.id===v);if(!iv)return;
    // Elegir el intervalo fija también la categoría: antes se podían desalinear
    // y la tarjeta salía con el color de otra categoría.
    setForm(x=>({...x,itvId:v,service:iv.name,cat:iv.cat}));
  };
  const recOK=!!form.date&&!!form.service&&form.itvId!==undefined;
  const saveRec=()=>{
    if(!recOK)return;
    const rec={...form,itvId:form.itvId??null,km:parseFloat(form.km)||0,amount:parseFloat(form.amount)||0};
    const next=editId?records.map(r=>r.id===editId?{...rec,id:editId}:r):[...records,{...rec,id:Date.now()}];
    setRecords(next);save(null,next,null);setShowRec(false);setEditId(null);
  };
  const delRec=id=>{const next=records.filter(r=>r.id!==id);setRecords(next);save(null,next,null);};
  /* Vincular un huérfano desde la lista, sin abrir el formulario entero. */
  const linkRec=(rid,itvId)=>{
    const iv=itvs.find(x=>x.id===itvId);if(!iv)return;
    const next=records.map(r=>r.id===rid?{...r,itvId,cat:iv.cat}:r);
    setRecords(next);save(null,next,null);
  };

  const openAddI=()=>{setIfrm({...EMPTY_I});setEditIId(null);setShowItv(true);};
  const openEditI=useCallback(x=>{setIfrm({name:x.name,cat:x.cat,km:String(x.km),days:String(x.days),note:x.note||""});setEditIId(x.id);setShowItv(true);},[records]);
  const saveItv=()=>{
    if(!ifrm.name||!ifrm.cat)return;
    const kv=parseInt(ifrm.km)||0,dv=parseInt(ifrm.days)||0;
    const prev=itvs.find(x=>x.id===editIId);
    const entry={cat:ifrm.cat,name:ifrm.name,km:kv,days:dv,note:ifrm.note,custom:prev?prev.custom:true};
    const nextItvs=editIId?itvs.map(x=>x.id===editIId?{...entry,id:editIId}:x):[...itvs,{...entry,id:newItvId()}];
    /* Aquí vivía la cascada que reescribía el `service` de los registros al
       renombrar un intervalo. Ya no hace falta: el vínculo es itvId y sobrevive
       al cambio de nombre. `service` se queda con lo que se escribió aquel día,
       que es lo que debe ser. */
    setItvs(nextItvs);save(null,null,nextItvs);setShowItv(false);setEditIId(null);
  };
  const delItv=useCallback(id=>{setItvs(prev=>{const next=prev.filter(x=>x.id!==id);save(null,null,next);return next;});},[]);
  const commitItv=useCallback((id,field,val)=>{
    setItvs(prev=>{const next=prev.map(x=>x.id===id?{...x,[field]:val}:x);save(null,null,next);return next;});
  },[]);

  const commitVehicle=field=>{const next={...vehicle,[field]:vDraft[field]};setVehicle(next);save(next,null,null);};

  /* Estado del respaldo. Lo que importa no es cuándo exportaste, sino si lo
     que tenés ahora está en alguna copia: por eso se compara updatedAt contra
     la fecha del export en vez de mirar sólo el tiempo transcurrido. Alguien
     que exportó y no volvió a tocar la app no tiene nada en riesgo, por muchos
     meses que pasen. */
  const haceCuanto=d=>d<=0?"hoy":d===1?"ayer":d<30?`hace ${d} días`:d<60?"hace un mes":d<365?`hace ${Math.floor(d/30)} meses`:"hace más de un año";
  const respaldo=(()=>{
    if(demo)return null;                       // no hay datos propios que perder
    // Mismo aviso y mismo color; sólo cambia la redacción cuando los datos
    // llegaron importados, porque ahí sí existe un archivo de origen.
    if(!lastExp)return fromImp
      ?{c:T.or,t:"No exportaste un respaldo desde este dispositivo",d:"Los datos llegaron por importación. Ese archivo respalda lo importado, pero no lo que edites desde acá."}
      :{c:T.or,t:"Nunca hiciste un respaldo",d:"Si perdés o reinicias el teléfono, estos datos no están en ningún otro sitio."};
    const dias=Math.floor((Date.now()-lastExp)/864e5);
    const cambio=updAt?new Date(updAt).getTime():null;
    if(!(cambio!=null&&cambio>lastExp))
      return{c:T.gr,t:"Respaldo al día",d:`No hubo cambios desde el último respaldo, ${haceCuanto(dias)}.`};
    return{
      c:dias>90?T.rd:dias>30?T.or:T.tx4,
      t:dias>30?"Tenés cambios sin respaldar":"Cambios sin respaldar",
      d:`Último respaldo ${haceCuanto(dias)}. Desde entonces editaste datos que no están en ninguna copia.`,
    };
  })();

  const exportData=()=>{
    // En modo ejemplo no hay nada guardado: descargar un backup vacío que
    // luego se pueda reimportar borraría la vista previa sin explicar nada.
    if(demo){alert("Todavía no hay nada que respaldar.\n\nLos registros que ves son ejemplos y no están guardados. Crea tu primer registro o completa los datos del vehículo, y vuelve a exportar.");return;}
    const data={vehicle,records,itvs,schemaVersion:SCHEMA,updatedAt:updAt,exportedAt:new Date().toISOString(),version:"1"};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=`automanto_backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();URL.revokeObjectURL(url);
    /* Se anota la descarga, no que el usuario haya conservado el archivo: el
       navegador no expone eso. Nótese que importar NO toca esta fecha, y es a
       propósito: un backup importado puede traer datos viejos, y haberlo
       importado no dice nada sobre si lo que edites después está a salvo. */
    const t=Date.now();
    try{localStorage.setItem(EK,String(t));}catch(_){}
    setLastExp(t);
  };

  const importData=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      const raw=pJSON(ev.target.result);
      if(!raw){alert("Archivo inválido: no es un JSON legible.");return;}
      if(!looksLikeBackup(raw)){alert("Ese archivo no parece un backup de AutoManto.\n\nNo se ha modificado nada.");return;}
      // Punto de entrada 2 de 3: se migra antes de preguntar, para que el
      // diálogo pueda contar los huérfanos reales y no una estimación.
      const d=migrate(raw);
      const sv=orphanCount(d);
      if(window.confirm(`¿Importar datos?\nEsto reemplazará tus registros actuales.\n\nVehículo: ${d.vehicle?.brand||"—"} ${d.vehicle?.model||""}\nRegistros: ${d.records?.length||0}\nIntervalos: ${d.itvs?.length||0}${sv?`\n\n⚠ ${sv} registro(s) quedarán sin vincular a ningún intervalo.\nSeguirán visibles y podrás vincularlos a mano.`:""}\n\nExportado: ${d.exportedAt?.slice(0,10)||"—"}`)){
        if(d.vehicle){setVehicle(d.vehicle);setVDraft(d.vehicle);}
        if(d.records)setRecords(d.records);
        if(d.itvs)setItvs(d.itvs);
        save(d.vehicle??vehicle,d.records??records,d.itvs??itvs);
        try{localStorage.setItem(IK,"1");}catch(_){}
        setFromImp(true);
        alert("✅ Datos importados correctamente");
      }
    };
    reader.readAsText(file);
    e.target.value="";
  };

  const importRef=useRef(null);

  /* Style helpers */
  const ff="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif";
  const card=(ex={})=>({background:T.cd,borderRadius:14,overflow:"hidden",...ex});
  const rrow=(ex={})=>({display:"flex",alignItems:"center",padding:"12px 16px",borderBottom:`0.5px solid ${T.sp}`,...ex});
  const inp=(ex={})=>({background:T.inp,color:T.tx,border:`1px solid ${T.inpB}`,borderRadius:10,padding:"10px 12px",fontSize:16,width:"100%",boxSizing:"border-box",outline:"none",...ex});
  const lbl={fontSize:13,color:T.tx3,display:"block",marginBottom:5};
  const sh={fontSize:12,fontWeight:600,color:T.tx3,textTransform:"uppercase",letterSpacing:0.6,marginBottom:8,paddingLeft:2};

  const TABS=[
    {id:"home",label:"Inicio",icon:"🏠"},
    {id:"track",label:"Seguimiento",icon:"⏱"},
    {id:"records",label:"Registros",icon:"📋"},
    {id:"config",label:"Config",icon:"⚙️"},
  ];

  if(!loaded)return(
    <div style={{background:T.bg,height:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16,fontFamily:ff}}>
      <div style={{fontSize:52}}>🚗</div>
      <div style={{fontSize:20,fontWeight:700,color:T.tx}}>AutoManto</div>
      <div style={{fontSize:14,color:T.tx3,marginTop:-8}}>Cargando datos...</div>
      <div style={{width:28,height:28,border:`3px solid ${T.bg3}`,borderTop:`3px solid ${T.ac}`,borderRadius:"50%",animation:"spin 0.8s linear infinite",marginTop:8}}/>
    </div>
  );

  return(
    <div style={{background:T.bg,color:T.tx,height:"100vh",display:"flex",flexDirection:"column",fontFamily:ff,WebkitFontSmoothing:"antialiased"}}>

      {/* HEADER */}
      <div style={{background:T.nb,flexShrink:0,padding:"0 16px 10px",paddingTop:"max(16px, env(safe-area-inset-top))",borderBottom:`0.5px solid ${T.br}`,zIndex:50}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{fontSize:22,fontWeight:700}}>{tab==="home"?"🚗 Panel":tab==="track"?"⏱ Seguimiento":tab==="records"?"📋 Registros":"⚙️ Config"}</div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            {tab==="records"&&<button onClick={openAdd} style={{background:T.ac,color:"#fff",border:"none",borderRadius:20,padding:"7px 16px",fontSize:14,fontWeight:600,cursor:"pointer"}}>+ Nuevo</button>}
            {tab==="config"&&<button onClick={openAddI} style={{background:T.gr,color:"#fff",border:"none",borderRadius:20,padding:"7px 16px",fontSize:14,fontWeight:600,cursor:"pointer"}}>+ Intervalo</button>}
            <button onClick={()=>setDark(d=>!d)} style={{background:T.bg3,border:"none",borderRadius:"50%",width:34,height:34,cursor:"pointer",fontSize:17,display:"flex",alignItems:"center",justifyContent:"center"}}>{dark?"☀️":"🌙"}</button>
          </div>
        </div>
        {vehicle.brand&&<div style={{fontSize:13,color:T.tx3,marginTop:3}}>{vehicle.brand} {vehicle.model} {vehicle.year}{km0>0?` · ${km0.toLocaleString()} km`:""}</div>}
        <div style={{display:"flex",alignItems:"center",gap:5,marginTop:4}}>
          <div style={{width:7,height:7,borderRadius:"50%",background:syncMsg.includes("…")?T.or:T.gr,flexShrink:0}}/>
          <div style={{fontSize:11,color:T.tx4}}>{syncMsg}</div>
        </div>
      </div>

      {/* AVISO: NUEVA VERSIÓN */}
      {swUpd&&(
        <div style={{background:T.ac,flexShrink:0,padding:"9px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
          <div style={{fontSize:13,color:"#fff",fontWeight:500}}>Nueva versión disponible</div>
          <button onClick={()=>location.reload()} style={{background:"rgba(255,255,255,0.25)",color:"#fff",border:"none",borderRadius:16,padding:"5px 14px",fontSize:13,fontWeight:600,cursor:"pointer",flexShrink:0}}>Actualizar</button>
        </div>
      )}

      {/* AVISO: INSTALAR */}
      {(canInst||iosTip)&&(
        <div style={{background:T.bg2,flexShrink:0,borderBottom:`0.5px solid ${T.br}`,padding:"10px 16px",display:"flex",alignItems:"center",gap:10}}>
          <div style={{fontSize:20,flexShrink:0}}>📲</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,fontWeight:600,color:T.tx}}>Instalar AutoManto</div>
            <div style={{fontSize:11,color:T.tx3,marginTop:1}}>{canInst?"Acceso directo y uso sin conexión.":"Pulsa Compartir y luego «Añadir a pantalla de inicio»."}</div>
          </div>
          {canInst&&<button onClick={doInstall} style={{background:T.ac,color:"#fff",border:"none",borderRadius:16,padding:"6px 14px",fontSize:13,fontWeight:600,cursor:"pointer",flexShrink:0}}>Instalar</button>}
          <button onClick={dismissPWA} aria-label="Descartar" style={{background:T.bg4,border:"none",borderRadius:"50%",width:26,height:26,cursor:"pointer",color:T.tx3,fontSize:13,flexShrink:0}}>✕</button>
        </div>
      )}

      {/* SCROLL BODY */}
      <div style={{flex:1,overflowY:"auto",WebkitOverflowScrolling:"touch"}}>
        <div style={{padding:"16px",paddingBottom:24}}>

          {/* ── HOME ── */}
          {tab==="home"&&<>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
              <div style={{...card(),padding:"14px 16px",borderTop:`3px solid ${T.ac}`}}>
                <div style={{fontSize:11,color:T.tx3,marginBottom:4,textTransform:"uppercase",letterSpacing:.5}}>Km actuales</div>
                <div style={{fontSize:24,fontWeight:700,color:T.tx}}>{km0>0?km0.toLocaleString():"—"}</div>
                <div style={{fontSize:11,color:T.tx4,marginTop:2}}>odómetro</div>
              </div>
              <div style={{...card(),padding:"14px 16px",borderTop:`3px solid ${T.pu}`}}>
                <div style={{fontSize:11,color:T.tx3,marginBottom:4,textTransform:"uppercase",letterSpacing:.5}}>Total gastado</div>
                <div style={{fontSize:22,fontWeight:700,color:T.tx}}>${ts.toLocaleString("es",{minimumFractionDigits:2})}</div>
                <div style={{fontSize:11,color:T.tx4,marginTop:2}}>{dispR.length} servicios</div>
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:16}}>
              {[{l:"Vencidos",v:ov,c:T.rd},{l:"Próximos",v:so,c:T.or},{l:"Al día",v:ok,c:T.gr}].map((s,i)=>(
                <div key={i} style={{background:T.cd,borderRadius:12,padding:"12px",textAlign:"center",border:`1.5px solid ${s.c}44`}}>
                  <div style={{fontSize:28,fontWeight:700,color:s.c}}>{s.v}</div>
                  <div style={{fontSize:12,color:s.c,fontWeight:500,marginTop:2}}>{s.l}</div>
                </div>
              ))}
            </div>
            {(ov>0||so>0)&&<>
              <div style={sh}>Atención requerida</div>
              <div style={{...card(),marginBottom:16}}>
                {tracking.filter(t=>t.st==="overdue"||t.st==="soon").slice(0,6).map((t,i,a)=>(
                  <div key={t.id} style={{...rrow({borderBottom:i<a.length-1?`0.5px solid ${T.sp}`:"none"}),gap:12}}>
                    <div style={{width:10,height:10,borderRadius:"50%",background:sc(t.st),flexShrink:0}}/>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:500,fontSize:15,color:T.tx,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.name}</div>
                      <div style={{fontSize:12,color:T.tx3}}>{t.cat}</div>
                    </div>
                    <div style={{textAlign:"right",flexShrink:0}}>
                      {t.kmL!==null&&<div style={{fontSize:13,fontWeight:600,color:sc(t.st)}}>{t.kmL<=0?`+${Math.abs(t.kmL).toLocaleString()}km`:`${t.kmL.toLocaleString()}km`}</div>}

                  <div style={sh}>Almacenamiento</div>

                      <div style={{width:9,height:9,borderRadius:"50%",background:v.c,flexShrink:0,marginTop:5}}/>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontWeight:500,fontSize:15,color:T.tx}}>{v.t}</div>
                        <div style={{fontSize:12,color:T.tx3,marginTop:2,lineHeight:1.45}}>{v.d}</div>

                </>
              );
            })()}

            <div style={sh}>Predefinidos</div>

                {f:"place",l:"Taller / Lugar",t:"text",ph:"Nombre del taller"},
                {f:"amount",l:"Monto ($)",t:"number",ph:"0.00"},
                {f:"desc",l:"Descripción",t:"area",ph:"Describe el servicio..."},

                        </>
                      )}
                    </>
                  ):t==="select"?(
                    <select value={form.cat} onChange={e=>setForm(x=>({...x,cat:e.target.value}))} style={inp()}>

              <button onClick={saveRec} disabled={!recOK} style={{padding:"14px",background:recOK?T.ac:T.bg4,color:recOK?"#fff":T.tx3,border:"none",borderRadius:12,cursor:"pointer",fontWeight:700,fontSize:17}}>

            </div>
          </div>

        <div style={{position:"fixed",inset:0,zIndex:200,background:"rgba(0,0,0,0.6)",display:"flex",alignItems:"flex-end"}}>
          <div style={{background:T.bg2,borderRadius:"20px 20px 0 0",width:"100%",maxHeight:"85vh",overflowY:"auto",WebkitOverflowScrolling:"touch",paddingBottom:32}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"16px 20px 12px",position:"sticky",top:0,background:T.bg2,zIndex:1,borderBottom:`0.5px solid ${T.br}`}}>
              <div style={{fontWeight:700,fontSize:18,color:T.tx}}>{editIId?"Editar intervalo":"Nuevo intervalo"}</div>
              <button onClick={()=>{setShowItv(false);setEditIId(null);}} style={{background:T.bg4,border:"none",borderRadius:"50%",width:30,height:30,cursor:"pointer",color:T.tx,fontSize:16}}>✕</button>
            </div>
            <div style={{padding:"16px 20px",display:"flex",flexDirection:"column",gap:14}}>
              <div><label style={lbl}>Nombre *</label><input value={ifrm.name} onChange={e=>setIfrm(x=>({...x,name:e.target.value}))} placeholder="ej. Limpieza de inyectores" style={inp()}/></div>
              <div>
                <label style={lbl}>Categoría *</label>
                <select value={ifrm.cat} onChange={e=>setIfrm(x=>({...x,cat:e.target.value}))} style={inp()}>
                  <option value="">Seleccionar...</option>
                  {CATS.map(c=><option key={c}>{c}</option>)}
                </select>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                <div><label style={lbl}>Cada (km)</label><input type="number" value={ifrm.km} onChange={e=>setIfrm(x=>({...x,km:e.target.value}))} placeholder="0" style={{...inp({textAlign:"center"})}}/></div>
                <div><label style={lbl}>Cada (días)</label><input type="number" value={ifrm.days} onChange={e=>setIfrm(x=>({...x,days:e.target.value}))} placeholder="0" style={{...inp({textAlign:"center"})}}/></div>
              </div>
              <div><label style={lbl}>Nota</label><input value={ifrm.note} onChange={e=>setIfrm(x=>({...x,note:e.target.value}))} placeholder="Descripción breve..." style={inp()}/></div>
              <button onClick={saveItv} disabled={!ifrm.name||!ifrm.cat} style={{padding:"14px",background:(!ifrm.name||!ifrm.cat)?T.bg4:T.gr,color:(!ifrm.name||!ifrm.cat)?T.tx3:"#fff",border:"none",borderRadius:12,cursor:"pointer",fontWeight:700,fontSize:17}}>
                {editIId?"Guardar cambios":"Crear intervalo"}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* TAB BAR */}
      <div style={{background:T.tb,borderTop:`0.5px solid ${T.br}`,flexShrink:0,paddingBottom:"max(12px, env(safe-area-inset-bottom))"}}>
        <div style={{display:"flex",justifyContent:"space-around",padding:"8px 0 0"}}>
          {TABS.map(t=>{
            const a=tab===t.id;
            return(
              <button key={t.id} onClick={()=>setTab(t.id)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"4px 16px",background:"none",border:"none",cursor:"pointer",color:a?T.ac:T.tx3,minWidth:60}}>
                <div style={{fontSize:22,opacity:a?1:0.6}}>{t.icon}</div>
                <div style={{fontSize:10,fontWeight:a?600:400}}>{t.label}</div>
                {a&&<div style={{width:4,height:4,borderRadius:"50%",background:T.ac,marginTop:1}}/>}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<script>
/* Registro del service worker.
   Se guarda el esquema: en file:// no existen los service workers, así que
   abrir index.html con doble clic sigue funcionando sin errores en consola. */
if("serviceWorker" in navigator && (location.protocol==="https:"||location.protocol==="http:")){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
