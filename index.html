<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Highway"/>
<meta name="theme-color" content="#f6f8fb"/>
<title>Highway</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" type="image/png" href="icon-192.png"/>
<link rel="apple-touch-icon" href="icon-apple.png"/>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--surface-page)}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}
::-webkit-scrollbar{width:0}
@keyframes spin{to{transform:rotate(360deg)}}
/* ===== Sistema de diseño Highway (Fase 0 — preparación) =====
   Tokens de marca portados de los mockups de Claude Design. Están inertes: por
   ahora ninguna clase ni variable se consume desde el árbol de React, así que
   no cambian nada visual. Las fases 1-4 irán conectando componentes a esta base.
   Tipografía: pila del sistema (sin Google Fonts), conservando tamaños/pesos. */
:root{
--blue-50:#eef4ff;--blue-100:#dbe8ff;--blue-200:#b8d0ff;--blue-300:#85adff;--blue-400:#4685fb;--blue-500:#016bf5;--blue-600:#0157c8;--blue-700:#01439b;--blue-800:#012a66;--blue-900:#011d47;--blue-950:#01122c;
--neutral-0:#fff;--neutral-50:#f6f8fb;--neutral-100:#eef1f6;--neutral-200:#e0e5ee;--neutral-300:#c9d1de;--neutral-400:#98a3b6;--neutral-500:#69748a;--neutral-600:#4b5568;--neutral-700:#363f4f;--neutral-800:#222a36;--neutral-900:#131922;--ink:#0b1019;
--green-50:#e8f7ee;--green-500:#17a34a;--green-600:#128a3e;--green-700:#0e6f32;
--amber-50:#fdf2e2;--amber-500:#f59310;--amber-600:#d97c06;--amber-700:#b56404;
--red-50:#fdecec;--red-500:#e11d2e;--red-600:#c1132a;--red-700:#9c0f22;
--brand:var(--blue-500);--brand-strong:var(--blue-600);--brand-dark:var(--blue-800);--brand-tint:var(--blue-50);
--brand-gradient:linear-gradient(155deg,#016bf5 0%,#0148a7 52%,#012a66 100%);
--brand-gradient-soft:linear-gradient(155deg,#2f83ff 0%,#0157c8 100%);
--text-strong:var(--neutral-900);--text-body:var(--neutral-700);--text-muted:var(--neutral-500);--text-faint:var(--neutral-400);--text-link:var(--blue-600);
--surface-page:var(--neutral-50);--surface-card:var(--neutral-0);--surface-sunken:var(--neutral-100);--surface-inverse:var(--blue-800);
--border:var(--neutral-200);--border-strong:var(--neutral-300);
--status-ok:var(--green-600);--status-ok-bg:var(--green-50);--status-due:var(--amber-600);--status-due-bg:var(--amber-50);--status-overdue:var(--red-600);--status-overdue-bg:var(--red-50);--status-idle:var(--neutral-500);--status-idle-bg:var(--neutral-100);
--font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--font-mono:ui-monospace,"SF Mono",monospace;
--radius-sm:10px;--radius-md:14px;--radius-lg:18px;--radius-xl:24px;--radius-2xl:30px;--radius-pill:999px;
--shadow-xs:0 1px 2px rgba(1,42,102,.06);--shadow-sm:0 1px 3px rgba(1,42,102,.08),0 1px 2px rgba(1,42,102,.05);--shadow-card:0 2px 10px rgba(1,42,102,.07);--shadow-md:0 6px 20px rgba(1,42,102,.10);--shadow-lg:0 16px 40px rgba(1,42,102,.16);--shadow-brand:0 8px 22px rgba(1,107,245,.30);
}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
/* ── Fase 1: shell responsive + navegación ──
   Móvil (<900px): barra inferior con FAB central. Escritorio (>=900px): barra
   lateral. El resto del contenido todavía es la interfaz previa; se rediseña
   en las fases 2-4. Las clases usan los tokens de la Fase 0. */
.hw-shell{display:flex;flex-direction:column}
.hw-main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
/* barra inferior (móvil) */
.hw-tabbar{flex-shrink:0;display:flex;align-items:flex-start;justify-content:space-around;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border);padding:10px 12px 0;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.hw-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;cursor:pointer;font-family:inherit;font-size:10.5px;font-weight:600;color:var(--neutral-400);padding:0}
.hw-tab.on{color:var(--brand)}
.hw-tab .ic{width:23px;height:23px}
.hw-fab{flex:0 0 auto;width:56px;height:56px;margin-top:-18px;border-radius:20px;background:var(--brand-gradient);box-shadow:var(--shadow-brand);display:flex;align-items:center;justify-content:center;color:#fff;border:none;cursor:pointer}
.hw-fab .ic{width:26px;height:26px;stroke-width:2.2}
/* barra lateral (escritorio) */
.hw-side{display:none;flex-direction:column;width:236px;flex:0 0 auto;background:var(--surface-card);border-right:1px solid var(--border);padding:24px 16px}
.hw-side .d-brand{display:flex;align-items:center;gap:11px;padding:4px 8px 26px}
.hw-side .d-brand img{width:38px;height:38px;border-radius:11px}
.hw-side .d-brand b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--blue-900)}
.hw-side .d-brand span{display:block;font-size:11px;font-weight:600;color:var(--neutral-400)}
.hw-side .d-nav{display:flex;flex-direction:column;gap:4px}
.hw-side .d-navi{display:flex;align-items:center;gap:12px;height:44px;padding:0 14px;border-radius:12px;font-size:14px;font-weight:600;color:var(--neutral-600);background:none;border:none;cursor:pointer;font-family:inherit;width:100%;text-align:left}
.hw-side .d-navi .ic{width:20px;height:20px}
.hw-side .d-navi.active{background:var(--brand-tint);color:var(--blue-700);font-weight:700}
.hw-side-sp{flex:1}
@media(min-width:900px){
  .hw-shell{flex-direction:row}
  .hw-side{display:flex}
  .hw-tabbar{display:none}
}
/* ── Fase 2: Inicio (Variante A móvil + escritorio) ──
   Datos reales; los estados usan las mismas clases ok/soon/overdue del cálculo
   de tracking. Los bloques móvil/escritorio se alternan por el punto de quiebre. */
.hw-mob{display:block}
.hw-desk{display:none}
@media(min-width:900px){.hw-mob{display:none}.hw-desk{display:block}}
/* utilidades compartidas */
.badge{display:inline-flex;align-items:center;gap:5px;height:23px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.badge .bd{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.ok{background:var(--status-ok-bg);color:var(--status-ok)}
.badge.soon{background:var(--status-due-bg);color:var(--status-due)}
.badge.overdue{background:var(--status-overdue-bg);color:var(--status-overdue)}
.prog{height:5px;border-radius:999px;background:var(--surface-sunken);overflow:hidden}
.prog>i{display:block;height:100%;border-radius:999px}
.prog>i.ok{background:var(--green-500)}.prog>i.soon{background:var(--amber-500)}.prog>i.overdue{background:var(--red-500)}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:20px 2px 12px}
.sec-h h3{font-size:15px;font-weight:800;letter-spacing:-.01em;color:var(--blue-900)}
.sec-h .lnk{font-size:12.5px;font-weight:700;color:var(--blue-600);background:none;border:none;cursor:pointer;font-family:inherit}
/* --- móvil: Variante A --- */
/* padding-top como forma LARGA a propósito: WebkitiOS descarta env()/max() dentro del shorthand `padding`, y con la declaracion caida el contenido queda a y=0, detras de la isla. La forma larga si la acepta (es lo que usa el header viejo). El shorthand deja el fallback de 16px si algo fallara. */
.a-wrap{padding:16px 18px 22px;padding-top:max(16px,env(safe-area-inset-top))}
.hw-greet{padding:2px 2px 12px}
.hw-greet .hi{font-size:12.5px;font-weight:600;color:var(--neutral-500)}
.hw-greet .hi b{color:var(--blue-900);font-weight:800}
.hw-greet .veh{font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--blue-900);margin-top:2px}
.hw-greet .veh .yr{color:var(--neutral-400);font-weight:600}
.a-hero{position:relative;border-radius:var(--radius-xl);background:var(--brand-gradient);color:#fff;padding:20px;overflow:hidden;box-shadow:var(--shadow-brand)}
.a-hero.ok{background:linear-gradient(150deg,#2fb463,#0e6f32)}
.a-hero .glow{position:absolute;right:-46px;top:-46px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(133,173,255,.45),transparent 68%)}
.a-hero .wm{position:absolute;right:-14px;bottom:-24px;width:118px;height:118px;color:rgba(255,255,255,.10)}
.a-hero .wm .ic{width:118px;height:118px;stroke-width:1}
/* Fix Fase 2: los adornos absolutos (glow/marca de agua) tapaban el botón del hero e interceptaban el clic. */
.a-hero .glow,.a-hero .wm,.d-hero .glow,.d-hero .wm{pointer-events:none}
.a-eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.16);padding:5px 10px;border-radius:999px}
.a-eyebrow .ic{width:13px;height:13px;stroke-width:2.2}
.a-hero h2{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:14px}
.a-hero .sub{font-size:14px;font-weight:600;color:#dbe8ff;margin-top:3px}
.a-hero.ok .sub{color:#cdefdb}
.a-hero .meta{font-size:12px;color:#b8d0ff;margin-top:2px}
.a-hero.ok .meta{color:#b6e3c6}
.a-hero .row{display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.16)}
.a-odo{font-size:12px;color:#b8d0ff}
.a-hero.ok .a-odo{color:#b6e3c6}
.a-odo b{display:block;font-size:19px;color:#fff;font-weight:700}
.a-cta{height:40px;padding:0 16px;border-radius:12px;background:#fff;color:var(--blue-700);font-size:13.5px;font-weight:700;border:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-family:inherit}
.a-hero.ok .a-cta{color:var(--green-700)}
.a-cta .ic{width:16px;height:16px;stroke-width:2.2}
.a-chips{display:flex;gap:8px;margin:14px 0 2px}
.a-chip{flex:1;background:var(--surface-card);border:1px solid var(--border);border-radius:14px;padding:9px 10px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow-xs)}
.a-chip .n{font-size:19px;font-weight:800;letter-spacing:-.02em}
.a-chip .l{font-size:10.5px;font-weight:600;color:var(--neutral-500)}
.a-chip.overdue .n{color:var(--status-overdue)}.a-chip.soon .n{color:var(--status-due)}.a-chip.ok .n{color:var(--status-ok)}
.a-list{display:flex;flex-direction:column;gap:10px}
.a-card{background:var(--surface-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;box-shadow:var(--shadow-card);display:flex;gap:13px;align-items:center;width:100%;text-align:left;cursor:pointer;font-family:inherit}
.a-card .tile{width:44px;height:44px;flex:0 0 auto;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--brand-tint);color:var(--blue-600)}
.a-card .tile.ok{background:var(--status-ok-bg);color:var(--status-ok)}.a-card .tile.soon{background:var(--status-due-bg);color:var(--status-due)}.a-card .tile.overdue{background:var(--status-overdue-bg);color:var(--status-overdue)}
.a-card .tile .ic{width:23px;height:23px}
.a-card .mid{flex:1;min-width:0}
.a-card .mid .nm{font-size:14.5px;font-weight:700;color:var(--blue-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-card .mid .mt{font-size:11.5px;color:var(--neutral-500);margin-top:2px}
.a-card .mid .prog{margin-top:9px}
.a-card .rt{text-align:right;flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.a-card .rt .rem{font-size:12px;font-weight:700}
.a-card .rt .rem.ok{color:var(--status-ok)}.a-card .rt .rem.soon{color:var(--status-due)}.a-card .rt .rem.overdue{color:var(--status-overdue)}
.hw-note{background:var(--surface-card);border:1px dashed var(--border-strong);border-radius:var(--radius-lg);padding:24px 16px;text-align:center;color:var(--neutral-500);font-size:13.5px}
/* --- escritorio: Inicio --- */
.d-main2{padding:26px 32px}
.d-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.d-topbar .tt .k{font-size:12.5px;font-weight:600;color:var(--neutral-500)}
.d-topbar .tt .k b{color:var(--blue-900);font-weight:800}
.d-topbar .tt h2{font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--blue-900);display:flex;align-items:center;gap:10px;margin-top:2px}
.d-topbar .tt h2 .yr{color:var(--neutral-400);font-weight:600}
.d-topbar .tt h2 .kmchip{font-size:12px;font-weight:700;font-family:var(--font-mono);color:var(--blue-700);background:var(--brand-tint);padding:4px 9px;border-radius:8px}
.d-btn{height:44px;padding:0 18px;border-radius:13px;background:var(--brand-gradient);color:#fff;font-size:14px;font-weight:700;border:none;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow-brand);cursor:pointer;font-family:inherit}
.d-btn .ic{width:19px;height:19px;stroke-width:2.3}
.d-upper{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;margin-bottom:20px}
.d-hero{border-radius:var(--radius-xl);background:var(--brand-gradient);color:#fff;padding:26px 28px;position:relative;overflow:hidden;box-shadow:var(--shadow-brand);display:flex;flex-direction:column;min-height:220px}
.d-hero.ok{background:linear-gradient(150deg,#2fb463,#0e6f32)}
.d-hero .glow{position:absolute;right:-40px;top:-50px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(133,173,255,.4),transparent 68%)}
.d-hero .wm{position:absolute;right:14px;bottom:-16px;width:130px;height:130px;color:rgba(255,255,255,.1)}
.d-hero .wm .ic{width:130px;height:130px;stroke-width:1}
.d-hero .a-eyebrow{align-self:flex-start}
.d-hero h3{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:14px}
.d-hero .sub{font-size:15px;font-weight:600;color:#dbe8ff;margin-top:4px}
.d-hero.ok .sub{color:#cdefdb}
.d-hero .meta{font-size:12.5px;color:#b8d0ff;margin-top:2px}
.d-hero .foot{margin-top:auto;padding-top:20px;display:flex;align-items:center;justify-content:space-between}
.d-hero .foot .odo b{display:block;font-size:20px;font-weight:700}
.d-hero .foot .odo span{font-size:11.5px;color:#b8d0ff}
.d-hero .foot button{height:40px;padding:0 18px;border-radius:12px;background:#fff;color:var(--blue-700);border:none;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
.d-hero.ok .foot button{color:var(--green-700)}
.d-side2{display:flex;flex-direction:column;gap:14px}
.d-scard{background:var(--surface-card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:16px 18px;flex:1;display:flex;align-items:center;gap:14px}
.d-scard .n{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1;width:44px}
.d-scard.overdue .n{color:var(--status-overdue)}.d-scard.soon .n{color:var(--status-due)}.d-scard.ok .n{color:var(--status-ok)}
.d-scard .tx b{font-size:14px;font-weight:700;color:var(--blue-900)}
.d-scard .tx span{display:block;font-size:11.5px;color:var(--neutral-500);margin-top:1px}
.d-scard .dchip{margin-left:auto;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.d-scard.overdue .dchip{background:var(--status-overdue-bg);color:var(--status-overdue)}.d-scard.soon .dchip{background:var(--status-due-bg);color:var(--status-due)}.d-scard.ok .dchip{background:var(--status-ok-bg);color:var(--status-ok)}
.d-scard .dchip .ic{width:20px;height:20px}
.d-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(min-width:900px) and (max-width:1200px){.d-grid{grid-template-columns:repeat(3,1fr)}}
.d-card{background:var(--surface-card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:16px;width:100%;text-align:left;cursor:pointer;font-family:inherit}
.d-card .ch{display:flex;align-items:center;justify-content:space-between}
.d-card .tile{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--brand-tint);color:var(--blue-600)}
.d-card .tile.ok{background:var(--status-ok-bg);color:var(--status-ok)}.d-card .tile.soon{background:var(--status-due-bg);color:var(--status-due)}.d-card .tile.overdue{background:var(--status-overdue-bg);color:var(--status-overdue)}
.d-card .tile .ic{width:21px;height:21px}
.d-card .nm{font-size:14px;font-weight:700;color:var(--blue-900);letter-spacing:-.01em;margin-top:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-card .rem{font-size:12px;font-weight:600;margin-top:9px}
.d-card .rem.ok{color:var(--status-ok)}.d-card .rem.soon{color:var(--status-due)}.d-card .rem.overdue{color:var(--status-overdue)}
.d-card .prog{margin-top:8px}
.d-card .mt{display:flex;justify-content:space-between;font-size:11px;color:var(--neutral-500);margin-top:11px;padding-top:11px;border-top:1px solid var(--neutral-100)}
.d-card .mt b{color:var(--blue-900);font-weight:700}
</style>
</head>
<body>
<div id="root"></div>

<!-- Sprite de íconos del sistema de diseño (Fase 1: navegación). Oculto; se
     referencia con <use href="#i-..."/>. Se ampliará en fases posteriores. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3.8 11.3 12 4l8.2 7.3"/><path d="M5.8 9.8V19h12.4V9.8"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.4V12l3 1.8"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M8.5 6.5h11M8.5 12h11M8.5 17.5h11M4.4 6.5h.02M4.4 12h.02M4.4 17.5h.02"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.1"/><path d="M12 2.4v2.6M12 19v2.6M4.4 4.4l1.9 1.9M17.7 17.7l1.9 1.9M2.4 12H5M19 12h2.6M4.4 19.6l1.9-1.9M17.7 6.3l1.9-1.9"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-oil" viewBox="0 0 24 24"><path d="M12 3c3 4 5 6.6 5 9.5A5 5 0 0 1 7 12.5C7 9.6 9 7 12 3Z"/><path d="M9.6 12.6a2.6 2.6 0 0 0 2.4 2.4"/></symbol>
<symbol id="i-brake" viewBox="0 0 24 24"><circle cx="10.5" cy="12" r="7.5"/><circle cx="10.5" cy="12" r="2.6"/><rect x="16" y="8.4" width="4" height="7.2" rx="1.6"/></symbol>
<symbol id="i-tire" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.3"/><path d="M12 2.9v3.2M12 17.9v3.2M2.9 12h3.2M17.9 12h3.2M5.6 5.6l2.2 2.2M16.2 16.2l2.2 2.2M18.4 5.6l-2.2 2.2M7.8 16.2l-2.2 2.2"/></symbol>
<symbol id="i-battery" viewBox="0 0 24 24"><rect x="2.5" y="7" width="16" height="10" rx="2.4"/><path d="M18.5 10.2h1.6a1 1 0 0 1 1 1v1.6a1 1 0 0 1-1 1h-1.6"/><path d="M6.4 12h3M7.9 10.5v3M13 12h2.6"/></symbol>

const SK="automanto_v3", IDB_NAME="automanto_db", SCHEMA=2;
function idbOpen(){return new Promise((res,rej)=>{try{const r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=e=>e.target.result.createObjectStore("kv");r.onsuccess=e=>res(e.target.result);r.onerror=()=>rej();}catch(e){rej(e);}});}
async function idbGet(){try{const db=await idbOpen();return await new Promise((res,rej)=>{const tx=db.transaction("kv","readonly");const r=tx.objectStore("kv").get(SK);r.onsuccess=()=>res(r.result??null);r.onerror=()=>rej();});}catch{return null;}}
async function idbSet(val){try{const db=await idbOpen();await new Promise((res,rej)=>{const tx=db.transaction("kv","readwrite");tx.objectStore("kv").put(val,SK);tx.oncomplete=()=>res();tx.onerror=()=>rej();});return true;}catch{return false;}}
const lsGet=()=>{try{return localStorage.getItem(SK);}catch{return null;}};
const lsSet=v=>{try{localStorage.setItem(SK,v);}catch{}};
const pJSON=s=>{try{if(s)return JSON.parse(s);}catch{}return null;};
// Punto de entrada 1 de 3: todo lo que se lee de disco pasa por migrate().
async function storageLoad(){const fast=pJSON(lsGet());if(fast)return migrate(fast);return migrate(pJSON(await idbGet()));}
async function storageSave(data){const st={...data,schemaVersion:SCHEMA,updatedAt:new Date().toISOString()};const j=JSON.stringify(st);lsSet(j);await idbSet(j);return st.updatedAt;}

/* Equivalencia entre los ids numéricos 1–24 de v1 y los slugs estables de v2.
   El migrador mapea por este id numérico y NO por el nombre: el nombre pudo
   haberse renombrado, el id numérico sobrevivió a cualquier renombre. */
const LEGACY_ID={
  1:"oil-engine",2:"oil-filter",3:"air-filter",4:"fuel-filter",5:"cabin-filter",
  6:"coolant",7:"brake-fluid",8:"transmission-fluid",
  9:"brake-pads-front",10:"brake-pads-rear",11:"brake-discs",
  12:"shock-absorbers",13:"ball-joints",
  14:"tire-rotation",15:"wheel-alignment",16:"tire-replacement",
  17:"spark-plugs",18:"timing-belt",19:"serpentine-belt",
  20:"battery",21:"alternator",
  22:"ac-condenser-clean",23:"ac-refrigerant",24:"general-inspection",
};

/* ── Migración de esquema ──
   Es aditiva y no destruye nada: añade `itvId` a los registros y conserva
   `record.service` como etiqueta histórica. Eso da compatibilidad en ambos
   sentidos: un backup v1 se convierte al vuelo, y un documento v2 abierto por
   un build v1 sigue funcionando porque v1 lee `service`, que nunca se borra. */
const newItvId=()=>{
  try{if(typeof crypto!=="undefined"&&crypto.randomUUID)return crypto.randomUUID();}catch(_){}
  // randomUUID exige contexto seguro; en file:// no existe.
  return "itv-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);
};

/* Lleva un documento cualquiera a la forma v2, mire lo que mire su etiqueta.
   Cada decisión es local: un intervalo con id de tipo string ya está migrado;
   un registro que ya tiene la clave itvId se respeta tal cual, incluso si vale
   null (es un huérfano conocido, y C3 dará la acción para vincularlo a mano).
   Por eso es idempotente y puede aplicarse cuantas veces haga falta. */
function toV2(d){
  /* Si el documento no trae lista de intervalos, se parte de los de fábrica:
     es lo que la app usaría de todos modos. Devolver [] dejaría al usuario sin
     ningún intervalo, porque un array vacío pasa el guardia `if(d.itvs)`. */
  const itvs=Array.isArray(d.itvs)?d.itvs:DEFAULT_INT;
  const nItvs=itvs.map(x=>{
    if(typeof x.id==="string"&&x.id)return{...x};   // ya tiene id estable
    const slug=x.custom?null:LEGACY_ID[x.id];
    return{...x,id:slug||newItvId()};
  });
  // Último uso del vínculo por nombre: de aquí en adelante manda itvId.
  const byName=new Map();
  nItvs.forEach(x=>{if(!byName.has(x.name))byName.set(x.name,x.id);});
  const recs=Array.isArray(d.records)?d.records:[];
  const nRecs=recs.map(r=>("itvId" in r)?{...r}:{...r,itvId:byName.has(r.service)?byName.get(r.service):null});
  return{...d,itvs:nItvs,records:nRecs,schemaVersion:2};
}

function migrate(doc){
  if(!doc||typeof doc!=="object"||Array.isArray(doc))return doc;
  /* No se mira schemaVersion a propósito. Ese campo es una etiqueta, y una
     etiqueta puede mentir: un documento marcado como v2 pero sin itvId se
     saltaría la migración y quedaría sin vincular en silencio, para siempre.
     toV2 decide elemento por elemento y es idempotente, así que aplicarlo
     siempre no cuesta nada y no depende de que nadie haya etiquetado bien. */
  return toV2(doc);
}

/* Registros que quedarían sin vincular. Lo muestra el diálogo de importar
   para que la decisión se tome viendo el coste, no a ciegas. */
const orphanCount=d=>(Array.isArray(d&&d.records)?d.records:[]).filter(r=>r.itvId==null).length;

/* Un JSON válido no es un backup de Highway. Sin esto, cualquier .json
   suelto reemplazaría los datos del usuario en cuanto confirmara el diálogo. */
const looksLikeBackup=d=>!!d&&typeof d==="object"&&!Array.isArray(d)&&(d.vehicle!==undefined||Array.isArray(d.records)||Array.isArray(d.itvs));

/* Punto de entrada 3 de 3: los datos semilla nacen ya en v2, con itvId. */
const SAMPLE_R=[

];

const saludoHora=()=>{const h=new Date().getHours();return h>=5&&h<12?"Buenos días":h>=12&&h<19?"Buenas tardes":"Buenas noches";};
const isIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const isStandalone=()=>window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;

/* Safari de verdad. Ojo: casi todos los UA llevan "Safari/537.36", incluido
   Chrome, así que hay que excluir los motores Chromium explícitamente. */
const isSafari=()=>{const ua=navigator.userAgent;return /Safari\//.test(ua)&&!/Chrome\/|Chromium\/|Edg\/|OPR\/|Android/.test(ua);};

/* El borrado a los ~7 días es de WebKit/ITP: aplica en Safari y en todo iOS,
   donde cualquier navegador usa WebKit por obligación. En Chrome o Firefox de
   escritorio el riesgo es otro: desalojo si hace falta espacio. Advertir de
   los 7 días donde no aplica sería mentirle al usuario. */
const aplicaPurga7d=()=>isIOS()||isSafari();

/* Cómo se instala en este navegador. Que no haya prompt nativo NO implica que
   estemos en iOS: puede ser Firefox, un shell embebido, o que las heurísticas
   del navegador todavía no lo hayan ofrecido. */
const comoInstalar=()=>isIOS()?"Pulsá Compartir y luego «Añadir a pantalla de inicio»."
  :isSafari()?"En Safari: menú Archivo → «Añadir al Dock»."
  :"Buscá «Instalar aplicación» o «Añadir a la pantalla de inicio» en el menú de tu navegador.";

/* Persistencia del almacenamiento (deuda #4).
   persist() es un PEDIDO, no una orden: el navegador decide y puede negarlo.
   WebKit lo concede por heurísticas, sobre todo si la app está instalada en
   pantalla de inicio; en una pestaña normal de Safari lo normal es que lo
   deniegue. Por eso se registra el resultado real: dar por hecho que quedó
   concedida sería el mismo error que nos trajo hasta aquí.
   Ojo: esto NO es la defensa contra el borrado a los 7 días de ITP. Esa
   exención la da estar instalada en pantalla de inicio, no esta llamada. */
/* Diagnóstico del service worker.
   Sin un Mac no se puede inspeccionar el worker de un iPhone, así que el
   estado tiene que verse desde la propia app.

   Ojo con lo que NO se puede mostrar: no existe API que exponga cuándo
   comprobó el navegador por última vez si `sw.js` cambió. Esa comprobación
   la hace él solo, en cada navegación y como mucho cada 24 h, y no la
   publica. Lo único medible es cuándo la pedimos nosotros con update(), que
   es lo que hace el botón "Buscar ahora". */
const hashCorto=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return (h>>>0).toString(16).padStart(8,"0");};

async function leerSW(){
  const d={soportado:"serviceWorker" in navigator,controlada:null,installing:null,waiting:null,active:null,
           caches:[],marca:false,doc:null,error:null};
  try{
    if(!d.soportado)return d;
    d.controlada=navigator.serviceWorker.controller?navigator.serviceWorker.controller.scriptURL.split("/").pop():null;
    const reg=await navigator.serviceWorker.getRegistration();
    if(reg){
      const url=w=>w?w.scriptURL.split("/").pop()+" · "+w.state:null;
      d.installing=url(reg.installing);d.waiting=url(reg.waiting);d.active=url(reg.active);
      d.scope=reg.scope;
    }
    d.caches=await caches.keys();
    d.marca=!!(await caches.match("https://automanto.local/update-pending"));
    // Huella del documento que la app está sirviendo desde caché
    const c=await caches.match(new Request(location.href.split("?")[0]),{ignoreSearch:true});
    if(c){const t=await c.text();d.doc={bytes:t.length,huella:hashCorto(t)};}
  }catch(e){d.error=e&&e.message?e.message:String(e);}
  return d;
}

async function checkPersistencia(){
  const info={estado:"na",instalada:isStandalone(),usage:null,quota:null};
  try{
    if(!navigator.storage||!navigator.storage.persist){
      console.info("[Highway] Storage API no disponible (Safari <17 o file://): no se puede pedir persistencia.");
      return info;
    }
    let ok=await navigator.storage.persisted();
    const yaEstaba=ok;
    if(!ok)ok=await navigator.storage.persist();
    info.estado=ok?"ok":"no";
    console.info(`[Highway] Almacenamiento persistente: ${ok?"CONCEDIDO":"DENEGADO"}`
      +` · app ${info.instalada?"instalada":"en pestaña del navegador"}`
      +(yaEstaba?" · ya lo estaba":"")
      +(ok?"":" · instalar en pantalla de inicio es lo que más ayuda a que se conceda"));
    if(navigator.storage.estimate){
      const e=await navigator.storage.estimate();
      info.usage=e.usage??null;info.quota=e.quota??null;
      console.info(`[Highway] Uso: ${Math.round((e.usage||0)/1024)} KB de ${Math.round((e.quota||0)/1048576)} MB`);
    }
  }catch(err){
    console.warn("[Highway] No se pudo consultar la persistencia:",err&&err.message);
    info.estado="error";
  }
  return info;
}

/* Bytes en unidades que se puedan leer de un vistazo. */
const fmtBytes=n=>{
  if(n==null||!isFinite(n))return"—";
  if(n<1024)return n+" B";
  if(n<1048576)return (n/1024).toFixed(n<10240?1:0)+" KB";
  if(n<1073741824)return (n/1048576).toFixed(n<10485760?1:0)+" MB";
  return (n/1073741824).toFixed(1)+" GB";
};

const todayD=new Date();
const fmt=d=>{if(!d)return"—";const p=d.split("-");return`${p[2]}/${p[1]}/${p[0]}`;};
const dDiff=(a,b)=>Math.round((new Date(a)-new Date(b))/(864e5));

          {iv.note&&<div style={{fontSize:11,color:T.tx4,marginTop:1}}>{iv.note}</div>}
        </div>
        <div style={{display:"flex",gap:5,flexShrink:0,marginLeft:8,alignItems:"center"}}>
          <span style={{fontSize:10,padding:"2px 7px",borderRadius:20,background:`${CC[iv.cat]||"#636366"}33`,color:CC[iv.cat]||"#636366",fontWeight:500}}>{iv.cat}</span>
          <button onClick={()=>onEdit(iv)} style={{fontSize:11,color:T.ac,background:"none",border:`0.5px solid ${T.ac}66`,borderRadius:14,padding:"2px 8px",cursor:"pointer"}}>Editar</button>
          {iv.custom&&<button onClick={()=>onDelete(iv.id)} style={{fontSize:11,color:T.rd,background:"none",border:`0.5px solid ${T.rd}66`,borderRadius:14,padding:"2px 8px",cursor:"pointer"}}>✕</button>}
        </div>
      </div>
      <div style={{display:"flex",gap:8}}>
        <div style={{flex:1}}>
          <div style={{fontSize:11,color:T.tx4,marginBottom:3}}>Cada (km)</div>
          <input ref={kmRef} type="text" inputMode="numeric" defaultValue={String(iv.km)} onBlur={hKb} style={fs}/>
        </div>
        <div style={{flex:1}}>
          <div style={{fontSize:11,color:T.tx4,marginBottom:3}}>Cada (días)</div>
          <input ref={dayRef} type="text" inputMode="numeric" defaultValue={String(iv.days)} onBlur={hDb} style={fs}/>
